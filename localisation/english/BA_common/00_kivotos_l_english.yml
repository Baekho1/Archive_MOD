 BA_all_country_category: "Kivotos Alliance"
 BA_all_country_category_desc: "While Schale began as an extrajudicial organisation under the GSC, the orders of the GSC President has completely subverted its original purpose. With the ambitious goal of complete Kivotos Unification, Schale absorbed the GSC in chaos to form the Kivotos Alliance. Schale has recently reformed into the 'European-Kivotos Alliance' to best adapt to the developing situation, and we have been tasked to navigate Schale into a prosperous future."
