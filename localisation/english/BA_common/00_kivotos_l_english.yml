 BA_highlander: "Highlander Railroad Academy"
 BA_highlander_desc: "The Highlander Railroad Academy was once tasked with the operation of the massive rail networks that span the entirety of Kivotos. However, with the central administration of Highlander and GSC in disarray, the Highlander's authority over rail infrastructure has been significantly diminished as individual academies have seized control of local railways. \n\nAs of this moment, we are able to either attain emancipation from the bureaucratic oversight of the Highlanders by taking over their railways or submit the Highlanders under our influence by heavily investing in them. With every investment to the Highlanders, we will receive bonuses in transport in return.\n\n[BA_highlander_best_invester]\n@[this.gettag]§Y[THIS.getname]§! invests: §Y[?THIS.BA_highlander_invest]§!\n£GFX_HTA_FLAG §YHighlander Patrons§!\n[BA_highlander_use_list]\n"
