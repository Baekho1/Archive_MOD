 BA_kiovotos_spain_event.1.t: "Chaos Downstairs"
 BA_kiovotos_spain_event.1.d: "There appears to be chaos brewing within our southern neighbour. According to information from Veritas, the military arm of the [SPR.getname] government has launched a coup d'état that is currently facing firece resistance from government forces and civil organisations. Meanwhile, countless refugees are currently on their way to our territories to avoid the ongoing civil war. The situation must be placed under our control."
 BA_kiovotos_spain_event.1.a: "Dammit."
 BA_kiovotos_spain_event.2.t: "The Refugee Dilemma"
 BA_kiovotos_spain_event.2.d: "We cannot stand by and watch the refugee crisis develop. Our citizens on the southern border are urgently demanding that these foreign refugees be expelled. However, progressive civil rights groups and student action groups are advocating for a humanitarian response."
 BA_kiovotos_spain_event.2.a: "Expel them all."
 BA_kiovotos_spain_event.2.b: "This is all the military junta's fault!"
 BA_kiovotos_spain_event.2.c: "We must condemn the incompetency of the Spanish government."
 BA_kiovotos_spain_event.3.t: "The Interference Committee"
 BA_kiovotos_spain_event.3.d: "Following the deployment of Millennium volunteers to the Spanish civil war, other nations of Kivotos are attempting to intervene in the conflict without restriction. We must establish an Interference Committee to uphold our relationship with other nations of Kivotos amidst their involvement in the conflict."
 BA_kiovotos_spain_event.3.a: "We must establish the committee"
 BA_kiovotos_spain_event.3.b: "Do we really need to control them?"
 BA_kiovotos_spain_event.3_tt: "£GFX_pol_power required to £GFX_decision_icon_small §Ysecede from the Kivotos Cooperative§! will be reduced by 20 for members of the Kivotos Cooperative."
 BA_kiovotos_spain_event.4.t: "Establishment of the Interference Committee"
 BA_kiovotos_spain_event.4.d: "With the approval of the GSC and the cooperation of Kivotos academies, the Interference Committee has been installed. The committee will be responsible for limiting unrestricted involvement of member nations in the Spanish Civil War, and has been authorised to monitor volunteer forces at all times. However, given all restrictions are abided by, we will still be able to conduct independent military action within the conflict."
 BA_kiovotos_spain_event.4.a: "Back in chains."
 BA_kiovotos_spain_event.5.t: "Offer from Millennium"
 BA_kiovotos_spain_event.5.d: "Under increasing involvement in both sides of the civil war, Millennium Science School has offered a compromise of non-interference. The proposal, which would signficantly reduce the Interference Committee's resources and restrictions at the cost of minimised volunteer forces, is currently a subject of heated debate amongst the member states."
 BA_kiovotos_spain_event.5.a: "Accept the offer."
 BA_kiovotos_spain_event.5.b: "Our sovereignty, our rules."
 BA_kiovotos_spain_event.6.t: "Hinder Millennium"
 BA_kiovotos_spain_event.6.d: "Millennium's foolish decision has left the civil war in a cruel stalemate with no clear end in sight! Until now, Millennium's respectable standing army has deterred any military retaliation, but the winds have changed. We shall swiftly strike the plains of northern France to eliminate their retalitory potential and spell an end for the flawed Millennium hegemony!"
 BA_kiovotos_spain_event.6.a: "Advance!"
 BA_kiovotos_spain_event.6.b: "We will not engage in such reckless acts."
 
 BA_interference_committee: "Interference Committee"

 ABY_abydos_sandstorm: "Sandstorms of Abydos"
 ABY_abydos_sandstorm_desc: "In the old world, Abydos once posessed endless fields of desert. However, in the Great Displacement, only a small portion of the academy and its deserted surroundings have endured inter-dimensional travel. Unfortunately, it appears that the presence of the desert is slowly by steadily bringing desertification to the European continent. Until the eco system has had ample time to recover, sandstorms will be a regular occurence in these lands."

