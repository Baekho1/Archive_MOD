 BA_generic_event.1.t: "British Colonies"
 BA_generic_event.1.desc: "The once invincible British Empire has capitulated, and what remains of the British forces in the Mediterranean and the Pacific are undergoind a disarrayed retreat. The absence of a proper colonial authority has spiralled these colonies into abject anarchy."
 BA_generic_event.1.a: "Conquest!"
 BA_generic_event.1.b: "Let sleeping dogs lie."

 BA_generic_event.2.t: "Chinese Concessions"
 BA_generic_event.2.desc: "The fall of the British Empire has brought chaos to Chinese concessions to the British Empire. Now is our time to take over these territories under the pretext of 'protecting' our citizens."
 BA_generic_event.2.a: "Great idea."
 BA_generic_event.2.b: "We cannot sell our future."

 BA_generic_event.3.t: "The London Bridge is Falling Down"
 BA_generic_event.3.desc: "With the decline of the great British Empire that once ruled the waves of the Pacific, there are no enemies left to oppose our expansion."
 BA_generic_event.3.a: "Banzai!"
 BA_generic_event.3.b: "We cannot sell our future."

 BA_generic_event.4.t: "Italian invasion of Millennium" 
 BA_generic_event.4.desc: "Sensing weakness in the ranks of our strange neighbours, Italy has requested our formal Declaration of War on Millennium Science school." 
 BA_generic_event.4.a: "The time has come."
 BA_generic_event.4.b: "Now is not the time."

 BA_generic_event.5.t: "China Offers Peace"
 BA_generic_event.5.desc: "The Republic of China has failed to withstand the attacks of the Empire of Japan, and have offered us a favourable peace deal."
 BA_generic_event.5.a: "Hell yeah!"

 BA_generic_event.6.t: "Japan accepts"
 BA_generic_event.6.desc: "The Empire of Japan has accepted our peace offer"
 BA_generic_event.6.a: "A dark day"

 BA_generic_event.7.t: "Abydos demands a referendum"
 BA_generic_event.7.desc: "In a speech in [4.GetName], Otto von Habsburg has demanded that his Austrian subjects be permitted to return to his rule. In a gesture of reconcilliation, however, he has publicly noted that the Austrian people should be permitted to make that choice for themselves."
 BA_generic_event.7.a: "Let the people have their say"
 BA_generic_event.7.b: "Such things should be left to professionals"

 BA_generic_event.8.t: "Referendum passed"
 BA_generic_event.8.desc: "Preliminary results show Abydos and the Monarchists to be on track for a majority!"
 BA_generic_event.8.a: "This is the will of the people."
 
 BA_generic_event.9.t: "Referendum failed"
 BA_generic_event.9.desc: "Despite extensive preparations by the pro-Abydos faction and the monarchists, the referendum has failed by a small margin, allowing the status quo to prevail."
 BA_generic_event.9.a: "What is the next step of the operation"
 
 BA_generic_event.10.t: "Referendum refused"
 BA_generic_event.10.desc: "Hungarian leader [HUN.Getleader] has publicly refused the idea of a referendum." 

 BA_generic_event.11.t: "Anarchy in Northern Ireland"
 BA_generic_event.11.d: "The British Empire has fallen to the extra-dimensional creatures and have been exiled from the British Isles. During their retreat from the Isles, a lack of British military presence in Northern Ireland has spiraled into a complete state of anarchy and riots.\nWith the English out of the equation, there is only one fate left for Northern Ireland."
 BA_generic_event.11.a: "Conquer Ireland!"
 ENG_to_IRE_Betray: "Darned traitors"
 BA_generic_event.11.b: "Assist the British in their retreat."
 ENG_to_IRE_HAPPYCAT: "Assisted"

 BA_generic_event.12.t: "Glory of the Forgotten Outlaws"
 BA_generic_event.12.d: "As we surveyed the island of Tahiti, a number of graves were encountered. In their investigation, it was discovered that they belonged to a group of outlaws. Strangely, masses of gold bars were found in the graves, which were revealed to originate from the banks of Saint-Denis, meaning the gold bars had been stolen from New Orleans.\n\nThe unsolved case of the 1899 New Orleans bank robbery was a noteworthy incident that signficantly influenced modern American culture.\nWhile the sudden disappearnce of the perpetrators appeared to conclude the case as an unsolved mystery, the unexpected discovery of their remains in Tahiti reinvigorated modern discourse on the robbers in the United States.\n\nIt is unclear whether they arrived in Tahiti via an accident or a planned relocation, but popular opinion seems to be swining in favour of a planned relocation to escape the eyes of the law.\n\nRegardless, the discovery seems to be acting as an unofficial ending sign for the era of the Wild West."
 BA_generic_event.12.a: "Red Dead Redemption"

 BA_generic_event.13.t: "Nuclear fission discovered"
 BA_generic_event.13.d: "Hahn and Strassmann, working at the Kaiser Wilhelm Institute for Chemistry in Berlin, bombarded uranium with neutrons.\n\nThey observed that, instead of the expected heavier elements, lighter elements like barium were produced. \n\nMeitner, who had fled Nazi Germany, and her nephew Frisch, a physicist, correctly interpreted Hahn and Strassmann's experimental data, realizing that the uranium nucleus had split, a process they named 'fission'.\n\nThis discovery revolutionized nuclear physics and led to the development of nuclear reactors and, later, atomic bombs."
 BA_generic_event.13.a: "An incredible discovery!"

 BA_generic_event.16.t: "§tProject KV detected!§!"
 BA_generic_event.16.d: "Shortly after we arrived in this strange world, news has arrived from the far east that another faction has been displaced via dimensional travel!\n\nAs it is an astonishing discovery, we must depart east post haste. Right now!"
 BA_generic_event.16.a: "Great idea!"
 BA_generic_event.16.b: "Are you out of your damn mind?"

 BA_generic_event.17.t: "[USA.getname] requests to join the Internationale"
 BA_generic_event.17.d: "[USA.getname] has expressed interest in joining the Internationale."
 BA_generic_event.17.a: "Great News!"
 BA_generic_event.17.b: "We can do without them."

 BA_generic_event.18.t: "[USA.getname] denies request"
 BA_generic_event.18.d: "[USA.getname] has decided to reject our request to join them."
 BA_generic_event.18.a: "Then we will crush them, too!"
 

 BA_generic_event.402.t: "Red Flood"
 BA_generic_event.402.d: "The might of the Red Army was impossible for the Finnish Army to resist. The Red Army was no longer a paper tiger; discipline and competency had been forged into the very core of the organisation through the blood and steel of combat. But what about us Finns?\n\nDecades of peace made us Finns complacent, our army defanged and our people dismissive of the 'Red savages'. And when the vigiliant few warned us of the 'Red Flood', they were silenced by the laughter and music of the decadent masses.\n\nThere was not a warrior left to resist when the Reds came. Our spirit of Sisu was no longer the valiant battle cry it once was, and with the complete shattering of the Mannerheim Line, Helsinki, our beloved capital, our beacon of liberty and our home was silenced in a matter of days.\n\nThe situation is bleak. The victorious Red Army runs rampant down the streets of Helsinki, desecrating our homes with their flags of red. If we were to be given one more chance, one last chance to redeem our decadence, could we defend our homeland from the Red Plague?"
 BA_generic_event.402.a: "One Life, One Chance"
 BA_generic_event_402_TT: "So falls the §YDawn of Finland§!, being completely stained §Rred§!. Even if Finland had been given §CAnother Chance§!, the result would have been the §tsame§!\n\nThank you for choosing Finland!\nNext time, maybe choose a Kivotos faction."

 BA_generic_event.401.t: "A New New Year"
 BA_generic_event.401.d: "Despite our troubles with our new neighbours, the year has finally come to its end.\nSome may be in spite, and others may be in tears, but the vast majority have elected to bury the hatchet for this moment, embracing the awkward warmth of enemies and strangers of yesterday.\nThe students and the native humans may be set apart by their differences, but the shared vision for a peaceful and prosperous future seems to be pointing towards a brighter New Year.\n\nSo far."
 BA_generic_event.401.a: "Maybe it'll get better this year."



