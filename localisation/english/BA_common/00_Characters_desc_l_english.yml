 # 트리니티 종합학원
 TRN_Airi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n$TRN_dkdlfl$ is a cheerful schoolgirl with an easygoing personality who loves to spend time chatting with her friends while eating sweets more than anything else. Her favorite food is ice cream and has recently become a member of the mint-chocolate gang."
 TRN_Yoshimi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n Yoshimi has a complex about her height and physique, and always gives the impression of an angry small animal. Despite wanting to look mature, she is always doted on for how her thoughts are reflected unchanged in her facial expression. Yoshimi's pastime is visiting cafes, tasting limited edition sweets and occasionally—smiles brighter than anyone else."
 TRN_Natsu_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\nInfamous as the 'trouble maker' of the Sweets Club, $TRN_skcm$ is a self proclaimed romanticist who tends to captive those around her. She also creates awkward moments for her friends with her habit of posing odd philosophical problems and comparing everything to deserts. But behind the facade of wackiness is the purest desire to share the \"Ideal\" moment with her friends.\n\n$TRN_skcm$'s definition of the 'Ideal' couldn't be more fluid. Today it could be a life as thick and rich as a double chocolate cake, but on another day it could be a lifestyle softly balanced like the cream and biscuit in a macaron. To the untrained eye, it might seem like $TRN_skcm$ is drowning her friends in her chaos, but no one really resists the harsh invitation to her constellation of creativity."
 TRN_Kazusa_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\nKazusa is a quiet and laid-back member of the Trinity After School Sweets Club. Instead of deliberately showcasing her presence, she softly lets herself get carried away by her friends' actions. Despite always having to clean up after their madness, Kazusa considers those seemingly inglorious moments as her most prized memories.\n\nUsually being the first one to spot conflict and tension, she can often be seen delicately de-escalating any conflict that may arise within the group. As a quiet and gentle 'giant', Kazusa is the literal and figurative counterweight of the club."
 TRN_Mika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\nAs the head of the Pater Faction of Trinity, Misono Mika is a bright and cheerful girl who breathes in life to her surroundings. As a former member of the Tea Party, she has maintained a close relationship with $TRN_skrltk$ since their childhood. However, due to their confrontational stances on politicla matters, she has been forced to carefully seperate public from private in their relationship.\n\n While she puts on a facade of laid-backness and joy, Mika's deepest and truest feelings are far from it. A truly interesting figure."
 TRN_Nagisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\nAs the head of the Fillius faction of Trinity, $TRN_skrltk$ is renowned for her soft yet well-spoken manner. Her smooth and tranquil attitude has created a strange yet deserving reputation as a mysterious being.\n\nAs the host of the Tea Party, $TRN_skrltk$ can often be seen preparing tea leaves and treats of the highest quality for their afternnon tea. Her devotion and care for ensuring the best possible tea has made participation in her tea parties a respectable privelege amongst students of Trinity."
 TRN_Seia_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\nDespite being the head of the Sanctus Faction of Trinity, there is limited information on $TRN_tpdldk$ as she is not a playable character.\n\n Nexon fix ur game.
 TRN_Sakurako_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n우타즈미 사쿠라코는 트리니티 학원의 시스터후드 소속 학생으로, 매사에 진지한 태도를 잃지 않는 신실한 인물입니다. 그녀는 뛰어난 책임감과 성실함으로 많은 사람들에게 두터운 신임을 받고 있으며, 언제나 경건한 마음으로 자신에게 맡겨진 책무를 수행합니다.\n\n그러나 사쿠라코의 고지식한 성향은 때때로 유행이나 일반적인 상식과는 동떨어진 모습을 보이게 만들기도 합니다. 그럼에도 그녀의 진심 어린 태도와 변함없는 정직함은 주변 사람들에게 깊은 인상을 남기며, 사쿠라코를 신뢰할 수 있는 존재로 자리매김하게 합니다."
 TRN_Hinata_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n와카바 히나타는 트리니티 시스터후드에 소속된 성실하고 선량한 소녀로, 트리니티 대성당의 관리를 책임지는 중요한 역할을 맡고 있습니다. 그녀는 주어진 일을 항상 성실히 완수하며, 누구에게나 친절하게 대하는 따뜻한 성격을 가지고 있습니다.\n\n그러나 약간 덜렁대는 성격 때문에 종종 실수를 저지르기도 하며, 이런 점 때문에 스스로에 대한 자신감이 부족한 편입니다. 그럼에도 불구하고 그녀는 자신의 책임을 묵묵히 다하며 주변 사람들에게 신뢰를 받고 있습니다.\n\n히나타가 늘 들고 다니는 가방에는 놀랍게도 설치형 거대 유탄 기관총이 들어 있습니다. 하지만 그 무게에도 불구하고 한 번도 힘들어하는 모습을 보인 적이 없습니다."
 TRN_Mari_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n이오치 마리는 트리니티 시스터후드에 소속된 신실하고 자애로운 소녀로, 언제나 상냥하고 부드러운 미소로 학원의 학생들을 따뜻하게 맞이합니다. 그녀는 귀여운 인상을 가지고 있지만, 차분하고 편안한 분위기를 만들어내는 능력이 있어 상담을 요청하는 학생들이 많습니다.\n\n마리는 늘 자신을 부족하다고 여기며, 더 나은 시스터가 되기 위해 노력하고 있습니다. 특히 존경하는 선배들처럼 훌륭한 시스터로 성장하는 것을 목표로 삼고 있습니다. 그녀의 진심 어린 태도와 따뜻한 배려심은 트리니티의 많은 학생들에게 위로와 희망을 전하고 있습니다."
 TRN_Kozeki_Ui_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n코제키 우이는 트리니티 도서부를 이끄는 도서부장으로, 사람보다 책을 더 좋아한다고 할 정도로 책에 대한 깊은 애정을 가진 소녀입니다. 특히 세월의 흔적이 깃든 오래된 책을 사랑하며, 낡은 페이지에서 느껴지는 고유의 매력을 소중히 여깁니다.\n\n평소에는 고요하고 고풍스러운 고서관에 틀어박혀 책을 읽거나 고서를 관리하며 대부분의 시간을 보냅니다. 잘 찾아오는 사람도 없는 그곳에서 우이는 자신의 세상을 만들어가며, 책과 함께하는 고요한 순간을 무엇보다 소중히 여깁니다."
 TRN_Shimiko_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n엔도우 시미코는 트리니티 도서부 소속의 사서로, 책을 진심으로 사랑하는 도서광 소녀입니다. 그녀는 트리니티 도서관의 방대한 장서를 거의 모두 읽어 본 몇 안 되는 학생 중 한 명으로, 그 지식과 열정은 도서부 내에서도 독보적입니다.\n\n책을 읽는 것을 즐길 뿐만 아니라, 다른 사람들에게 책을 권하는 일에도 큰 기쁨을 느낍니다. 시미코는 상대방의 취향을 세심히 고려하여 딱 맞는 책을 추천하려고 노력하며, 이를 통해 책의 매력을 다른 이들에게 전하는 데에 열정을 쏟습니다."
 TRN_tsurugi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n켄자키 츠루기는 트리니티 정의실현부의 부장이자 트리니티 학원의 공식 전략병기로, 호전적이고 폭력적인 성격을 지닌 소녀입니다. 그녀는 마음에 들지 않는 것이 있으면 일단 부수고 보는 행동으로 주변을 압도하며, 통제하기 어려운 광견 같은 면모를 자주 드러냅니다.\n\n그러나 이러한 격렬한 모습과는 달리, 츠루기는 핑크빛 청춘을 꿈꾸는 순수한 내면을 가진 소녀이기도 합니다. 그녀의 진심 어린 면모는 예상치 못한 순간에 드러나며, 반전 매력을 보여줍니다.\n\n전투 중에는 광기 어린 행동을 보이지만, 그 이면에는 깊은 사고와 냉철한 판단력을 지니고 있습니다. 츠루기는 전략적 판단에 능숙하며, 타인과의 소통 문제를 제외하면 집단의 리더로서 훌륭한 역할을 수행하는 유능한 인물입니다."
 TRN_Hasumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n하네카와 하스미는 트리니티 정의실현부의 2인자로, 켄자키 츠루기를 대신해 전술지휘관 역할을 담당하고 있습니다. 그녀는 침착하고 지적인 태도를 지닌 트리니티 여학생으로 보이지만, 사실은 달콤한 디저트를 좋아하며 디저트의 유혹을 참기 힘들어하는 평범한 소녀이기도 합니다.\n\n그렇지만 하스미는 정의실현부의 일원으로서 누구보다도 침착하게 상황을 판단하고, 필요할 때는 과감하고 무모한 행동을 서슴지 않습니다. 이러한 양면적인 성격은 그녀를 독특하고 매력적인 인물로 만들어 주며, 정의실현부의 중요한 역할을 맡는 데에 큰 도움을 줍니다."
 TRN_Ichika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n나카마사 이치는 항상 여유로운 표정을 지니고 있는 트리니티 정의실현부의 부원입니다. 정의실현부 내에서 다양한 성격의 학생들과 잘 어울리며, 특유의 융통성과 조율 능력으로 팀의 균형을 맞추는 역할을 자주 맡고 있습니다.\n\n그녀는 다른 학원과의 관계에서도 좋은 평가를 받고 있으며, 나긋나긋한 태도와 친절함으로 잘 알려져 있습니다. 하지만 이 모습은 진심이라기보다는 모두를 배려하려는 노력의 결과입니다.\n\n이치는 대부분의 상황에서 싱글싱글 웃으며 여유로운 태도를 유지하지만, 내적으로 분노가 쌓이게 된다면 돌연 앞뒤 가리지 않고 총기를 난사하며 난동을 일으키는 극단적인 모습을 보이기도 합니다. 이러한 반전 있는 성격은 정의실현부의 독특한 분위기 속에서도 그녀만의 독보적인 존재감을 만들어 냅니다."
 TRN_Mashiro_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n시즈야마 마시로는 트리니티 학원 정의실현부에서 묵묵히 화력 지원 임무를 수행하는 성실한 부원입니다. 그녀는 자신의 키와는 다소 어울리지 않는 거대한 대물 저격총을 항상 소지하고 있으며, 이를 다루는 데 있어 놀라운 능력을 보여줍니다.\n\n마시로는 말수가 적은 편이지만, 이는 낯을 가리거나 대인관계가 서투른 것이 아니라 조용한 성격에서 비롯된 것입니다. 특히 정의와 관련된 주제가 나오면 평소와는 달리 활발하게 이야기를 나누는 모습을 보이며, 자신의 신념에 깊은 애정을 가지고 있음을 드러냅니다."
 TRN_Koharu_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n시모에 코하루는 정의를 추구하며 트리니티 정의실현부에 가입한 열정적인 부원입니다. 그러나 그녀는 학업 성적이 낮아 유급 위기에 처해 있어, 스스로 엘리트라고 자부하는 모습과는 다소 어울리지 않는 면모를 보이기도 합니다. 실제로는 학교 수업을 따라가는 데 어려움을 겪는 바보 같은 귀여운 성격의 소유자입니다.\n\n또한 코하루는 독특한 취미로 야한 잡지를 수집하고 있으며, 사소한 자극에도 금세 상상을 부풀려 부끄러워하는 순진한 면을 가지고 있습니다. 이러한 특성 덕분에 정의실현부 내에서는 웃음을 자아내는 존재가 되기도 하지만, 그녀의 진심 어린 열정만큼은 누구도 부정할 수 없습니다."

 #아비도스 고등학교
 ABY_Hoshino_advisor_desc: "$FROM_Abydos_Academy$\n\n아비도스 고등학교의 유일한 3학년 이자 대책위원회의 정신적 지주인 타카나씨 호시노는 얼핏 보면 그저 잠을 좋아하는 귀여운 게으름 뱅이로 보입니다. 그녀의 느긋한 행동을 보고 있자면 선배의 위엄보다는 귀여운 후배로서의 느낌이 더 강합니다. 하지만 그녀가 사랑에 맞지 않는 아비도스 고등학교와 후배들에게 위함에 처하면 그녀는 전에 귀엽고 나긋한 모습은 어디 갔냐는 듯 강인하고 강직한. 강한 모습을 보일 것입니다. 다소 감정에 휘둘리는 경향이 있지만 그녀의 뛰어난 전투력은 그 무모함도 무마하고 가로막는 모든 것을 부수고 나아갈 그런 강인해 보이는 그녀도 가끔은 어벙하고 이상한 모습을 보일 때가 있습니다. 후배들이 이에 대해 물어보더라도 그녀는 대답을 회피하고 맙니다. 그녀가 마음에 담아두고 있는 말 못할 사연은 무엇일까요?"
 ABY_Shiroko_advisor_desc: "$FROM_Abydos_Academy$\n\n대책위원회 2 학년인 스나오오카미 시로코를 처음 만나면 그녀의 첫 인상에 반할지도 모릅니다. 아름답고 귀여운 수려한 외모와 차분하고 속삭이는 나긋한 목소리가 당신의 귀를 간지럽히며 빠져들지도 모르지만 그녀는 금방 당신의 기대를 배신할 것입니다. 활발하며 아무도 따라잡지 못하는 체력, 그녀의 입에서 튀어나오는 상식과는 수천만 년 떨어진 듯한 황당한 의견은 그녀와 오래 알고 지낸 대책위원회마저 당황시키곤 합니다. 하지만 이러한 면모가 오히려 그녀의 매력을 느끼게 하는 매개체가 되곤 합니다. 2학년이지만 아무도 멈추지 못하는 행동력은 마치 파릇파릇한 1학년을 연상케 하면서도 노련한 전투능력은 마치 구르고 구른 3학년과 같은 느낌을 줍니다. 그래서 인지 그녀는 호시노와 노노미에겐 귀여운 후배 취급을, 세리카와 아야네에겐 강인한 선배로서 존경받고 있습니다."
 ABY_Nonomi_advisor_desc: "$FROM_Abydos_Academy$\n\n아비도스 고등학교 2학년 이자요이 노노미는 가장 선배같은 면모를 가진 학생입니다. 매사에 긍정적이고 밝은 말투와 행동은 대책위원회를 다소 시킬 때도 있지만 대책위원회의 분위기를 늘 밝게 해줍니다. 또한 그녀는 대책위원회의 모두를 보듬어주며 의견을 취합하고 싸움을 방지하는 등 어머니 같은 모습을 보입니다. 대책위원회의 간식 부장이기도 한 그녀는 항상 모두의 사기를 북돋아 주는 역할을 합니다. 한편 그녀는 황금카드라는 것을 종종 꺼내곤 합니다. 황금카드는 모든 것을 살 수 있는 한도가 없는 카드라고 하는데 그걸 왜 아비도스 고등학교에 빚을 갚는데 쓰지 않았을까요? 종종 의문이 들때도 있지만 대책위원회는 깊게 파고들지 않습니다. 어쩌면 호시노라면 알지도 모르겠네요."
 ABY_Serika_advisor_desc: "$FROM_Abydos_Academy$\n\n아비도스 고등학교의 막내이자 귀여운 허당인 쿠로미 세리카는 자주 속곤 합니다. 쉽게 속아서 기껏 모은 돈을 날리거나 하는 일도 부지기수지만 동시에 가장 성실하다고 할 수 있는 그녀는 아비도스 고등학교가 빚을 갚는데 가장 큰 역할을 하고 있습니다. 아비도스 고등학교의 각별한 애정을 가진 그녀는 모두가 개인이 아르바이트로 번 돈은 빚을 갚는 데 쓰지 않고 함께 일한 것만 쓰자고 세리카를 배려해줬지만 그녀는 몰래 자신의 아르바이트비를 고등학교에 빚을 갚는데 쓰고 있습니다. 세리카는 선배들의 황당한 주장-주로 시로코-에 강하게 나올 때도 있고 말을 거칠게 하긴 하지만 속으로는 그 누구보다 대책위원회를 사랑하는 소녀입니다."
 ABY_Ayane_advisor_desc: "$FROM_Abydos_Academy$\n\n대책위원회 서기인 오쿠소라 아야네는 가장 어리지만 개성이 강한 선배들 사이에서 가장 어른스러운 모습을 보여줍니다. 다르게 말하면 개성 없이 심심하다고 생각할 수도 있지만 엉뚱한 선배들 사이에서 그녀는 평범함이란 개성을 돋보이게 합니다. 자주 선배들에게 휘둘리거나 선배들의 엉뚱한 의견을 쳐내는 등 대책위원회의 상식인으로서의 역할을 충실히 해내고 있습니다. 이쯤 되면 아야네에게 평범한 외 어떤 특징도 없다고 느낄 수 있지만 아닙니다. 주변인들에게 묻혀 잘 보이지. 뿐 아야네는 매우 똑똑한 축에 속합니다. 대책위원회의 모든 돈 출입을 관리하고 같은 재료로도 다른 이들보다 높은 수입을 내는 수완, 아비도스 고등학교의 시설물을 모두 관리하는 그녀의 능력은 범부가 흉내 낼 수 있는 게 아닙니다. 또한 역시 선배들의 압도적인 능력에 묻혀 잘 드러나지 않지만 체력도 상위권인 모든 것을 겸비한 소녀라고 할 수 있습니다."

 # 붉은겨울 연방학원
 RED_trotsky_desc: "$FROM_RedWinter_Academy$§L레프 트로츠키는 러시아 제국, 소비에트 연방의 볼셰비키 계열 정치인, 혁명가, 마르크스주의 이론가이자 사상적으로 트로츠키주의를 정립한 인물입니다. 경력상으로는 10월 혁명의 주역으로, 붉은 군대의 창시자이자 지도자로서 소련 건설에 지대한 공적을 세웠습니다. 블라디미르 레닌의 후계자로 거론될 정도였지만, 이오시프 스탈린과의 권력 투쟁에서 패배해 소련 공산당에서 제명되고 자신이 건국한 나라에서 추방당했습니다. 추방 이후 망명지를 옮겨 다니며 스탈린 체제를 비판하고 있습니다.§!\n\n§Y생애§! : §L러시아 제국 헤르손현 옐리사베트그라드군의 작은 마을 야놉카에서 출생했습니다. 그의 아버지 다비트 레온티예비치 브론시테인은 폴타바 출신의 유대계 우크라이나인으로 그의 가정에서는 우크라이나어·러시아어가 섞인 피진 수르지크를 사용하였습니다. 트로츠키의 아버지는 부농이었습니다. 그는 트로츠키가 9살이 되던 해 그를 오데사로 보내 독일 루터회 학교에서 공부하도록 하였습니다. 오데사는 여러 인종이 살던 국제도시였으므로 트로츠키는 국제주의에 눈뜨게 되었습니다. 이는 조지아인임에도 불구하고 철저히 러시아 민족주의를 강조한 이오시프 스탈린과 대비되는 점입니다. 트로츠키는 수석 졸업을 할 정도로 학업 성적이 우수했으며, 독일어는 물론 영어, 프랑스어에도 유창했습니다. 트로츠키는 자서전에서 자신의 어학 능력이 평범하다고 이야기했고, 특히 영어는 자유롭게 구사하지 못한다고 했으나 사실 트로츠키의 영어 연설을 보면 발음이 어색할 뿐, 문장 만드는 데는 별로 문제가 없는 것처럼 보입니다.\n 당시 러시아 제국은 황제의 전제 정치하에 있었고, 러시아에는 여러 사상적 배경을 가진 혁명 세력이 우후죽순처럼 생겨나며 조금이라도 깨어있는 사람은 모두 혁명 사상에 물들고 있었습니다. 수학을 전공하고 있던 트로츠키는 처음에는 러시아 전통 사상으로 사회주의 혁명을 이뤄보자는 인민주의자였으나 후에 마르크스주의에 영향을 받았습니다. 트로츠키는 보수주의자에서 인민주의자, 다시 마르크스주의자로 바뀌는 사상적 변화 과정이 무척 빨랐습니다.\n 그는 학생의 신분으로 혁명 운동에 뛰어들었고, 우크라이나 남부 니콜라예프의 노동자들을 조직하는 데 주도적 역할을 하였습니다. 이때부터 그의 조직 능력은 두각을 나타내었습니다. 게다가 연설 실력도 출중해서 2월 혁명 이후 반혁명적 장군인 라브르 코르닐로프의 쿠데타 부대가 수도에 진입하자 트로츠키는 이들을 막아서서 쿠데타 부대에 일장 연설을 했고, 그의 연설만 듣고 쿠데타 부대는 자진 해산해서 코르닐로프의 쿠데타는 실패하게 됩니다. 필력도 출중하여 레닌이 후에 \"그 사람의 글은 훌륭하기는 하지만, 너무 문체가 화려하다.\"라고 할 정도였습니다. 소련 연구가로 유명한 영국인 역사학자인 로버트 존 서비스는 트로츠키가 혁명가가 되지 않았더라도 문필가나 평론가로서 역사에 이름을 남겼을 것이라고 평할 정도였습니다.§!" # 트리니티에 왜 꼽사리 껴있음?