 # 트리니티 종합학원
 TRN_Airi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n$TRN_dkdlfl$ is a cheerful schoolgirl with an easygoing personality who loves to spend time chatting with her friends while eating sweets more than anything else. Her favorite food is ice cream and has recently become a member of the mint-chocolate gang."
 TRN_Yoshimi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\nYoshimi has a complex about her height and physique, and always gives the impression of an angry small animal. Despite wanting to look mature, she is always doted on for how her thoughts are reflected unchanged in her facial expression. Yoshimi's pastime is visiting cafes, tasting limited edition sweets and occasionally—smiles brighter than anyone else."
 TRN_Natsu_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\nInfamous as the 'trouble maker' of the Sweets Club, $TRN_skcm$ is a self proclaimed romanticist who tends to captive those around her. She also creates awkward moments for her friends with her habit of posing odd philosophical problems and comparing everything to deserts. But behind the facade of wackiness is the purest desire to share the \"Ideal\" moment with her friends.\n\n$TRN_skcm$'s definition of the 'Ideal' couldn't be more fluid. Today it could be a life as thick and rich as a double chocolate cake, but on another day it could be a lifestyle softly balanced like the cream and biscuit in a macaron. To the untrained eye, it might seem like $TRN_skcm$ is drowning her friends in her chaos, but no one really resists the harsh invitation to her constellation of creativity."
 TRN_Kazusa_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\nKazusa is a quiet and laid-back member of the Trinity After School Sweets Club. Instead of deliberately showcasing her presence, she softly lets herself get carried away by her friends' actions. Despite always having to clean up after their madness, Kazusa considers those seemingly inglorious moments as her most prized memories.\n\nUsually being the first one to spot conflict and tension, she can often be seen delicately de-escalating any conflict that may arise within the group. As a quiet and gentle 'giant', Kazusa is the literal and figurative counterweight of the club."
 TRN_Mika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\nAs the head of the Pater Faction of Trinity, Misono Mika is a bright and cheerful girl who breathes in life to her surroundings. As a former member of the Tea Party, she has maintained a close relationship with $TRN_skrltk$ since their childhood. However, due to their confrontational stances on politicla matters, she has been forced to carefully seperate public from private in their relationship.\n\n While she puts on a facade of laid-backness and joy, Mika's deepest and truest feelings are far from it. A truly interesting figure."
 TRN_Nagisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\nAs the head of the Fillius faction of Trinity, $TRN_skrltk$ is renowned for her soft yet well-spoken manner. Her smooth and tranquil attitude has created a strange yet deserving reputation as a mysterious being.\n\nAs the host of the Tea Party, $TRN_skrltk$ can often be seen preparing tea leaves and treats of the highest quality for their afternnon tea. Her devotion and care for ensuring the best possible tea has made participation in her tea parties a respectable privelege amongst students of Trinity."
 TRN_Seia_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\nDespite being the head of the Sanctus Faction of Trinity, there is limited information on $TRN_tpdldk$ as she is not a playable character.\n\n Nexon fix ur game."
 TRN_Sakurako_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\nUtazumi Sakurako is a student in the Sisterhood of the Trinity General School, and she is a faithful person who never loses her serious attitude. She is trusted by many people for her outstanding sense of responsibility and integrity, and she always fulfills the duties entrusted to her with a reverent heart.\n\nHowever, Sakurako's high-mindedness can sometimes make her seem out of touch with fashion or common sense. Nevertheless, her genuine demeanor and unwavering honesty impresses those around her and establishes Sakurako as a trustworthy person. Wappi☆~"
 TRN_Hinata_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\nWakaba Hinata is a sincere and good-hearted girl who belongs to the Trinity Sisterhood and plays an important role in the management of Trinity Cathedral. She always gets the job done and has a warm personality that is kind to everyone.\n\nHowever, she is a bit of a clumsy person and often makes mistakes, and because of this, she lacks confidence in herself. Nevertheless, she takes her responsibilities seriously and is trusted by those around her.\n\nThe bag that Hinata always carries is surprisingly equipped with a giant grenade launcher emplacement. But despite the weight, she's never been seen to struggle."
 TRN_Mari_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\nIochi Mari is a faithful and compassionate girl in the Trinity Sisterhood, always welcoming the students of the academy with a kind and gentle smile. She has a cute face and has the ability to create a calm and relaxed atmosphere, which is why many students come to her for counseling.\n\nMari has always felt inadequate and strives to be a better Sister. She aims to be a great Sister, especially like the ones she looks up to. Her genuine demeanor and warm, caring spirit has brought comfort and hope to many students at Trinity."
 TRN_Kozeki_Ui_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\nKozeki Ui is the head of Trinity Academy's library department, and she has a deep love for books, to the point where she says she likes books more than people. She loves old books, especially those that have seen better days, and cherishes the inherent charm that comes from their worn pages.\n\nOutside of work, she spends most of her time in the tranquil, quaint library, reading and maintaining her collection. There, in a place that is rarely visited, Kozeki Ui creates her own world and values the quiet moments with her books above all else."
 TRN_Shimiko_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\nEndo Shimiko is a librarian in Trinity Academy's library department, and a bibliophile girl who loves books with all her heart. She is one of the few students who has read nearly all of Trinity Library's vast collection, and her knowledge and enthusiasm are unique within the library department.\n\nNot only does she enjoy reading books, but she also takes great pleasure in recommending them to others. Shimiko is passionate about sharing her love of books with others by carefully considering their tastes and recommending just the right book."
 TRN_tsurugi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\nKenzaki Tsurugi is the head of Trinity Academy's Justice Task Force and the official strategic weapon of Trinity Academy, a girl with a belligerent and violent personality. She dominates her surroundings by destroying anything she doesn't like, and often displays a rabid side that is difficult to control.\n\nBut beneath this fierce exterior, Tsurugi is also a girl with an innocent heart who dreams of pink youth. Her heartfelt side comes out when you least expect it, and it's a charming twist.\n\nIn battle, she acts like a maniac, but underneath it all, she's a deep thinker and has a cool head. Tsurugi is good at making strategic judgments, and aside from her communication issues with others, she is a competent individual who does a good job as a leader of a group."
 TRN_Hasumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\nHanekawa Hasumi is the second-in-command of Trinity Academy's Justice Task Force, filling in for Kenzaki Tsurugi as tactical commander. She may appear to be a Trinity girl with a calm, intellectual demeanor, but she's actually just a regular girl with a sweet tooth and a hard time resisting the temptation of dessert.\n\nHowever, as a member of the Justice Task Force, Hasumi is more than capable of calmly assessing a situation and being bold and reckless when necessary. This ambivalence makes her a unique and fascinating character, and helps her fill an important role in the Justice Task Force."
 TRN_Ichika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\nNakamasa Ichika is a member of Trinity Academy's Justice Task Force who always has a relaxed expression on her face. She works well with a wide range of personalities within the Justice Task Force and is often called upon to balance the team with her flexibility and ability to coordinate.\n\nHer relationships within other schools are also well-regarded, and she is known for her easygoing demeanor and kindness. But it's more of an effort to be considerate of everyone than it is to be genuine.\n\nIchika is always smiling and laid-back in most situations, but when anger builds up inside her, she can go on a rampage, firing her gun without looking back. This twisted personality makes her stand out in the unique atmosphere of the Justice Task Force."
 TRN_Mashiro_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\nShizuyama Mashiro is a loyal member of Trinity Academy's Justice Task Force who quietly performs fire support duties. She always carries a massive anti-materiel sniper rifle that is somewhat out of place for her stature, and shows incredible skill with it.\n\nMashiro is a woman of few words, but this comes from her quiet nature, not from being shy or socially awkward. When the topic of justice comes up, she becomes uncharacteristically engaged in the conversation, revealing that she cares deeply about her beliefs."
 TRN_Koharu_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\nShimoe Koharu is a passionate member who joined Trinity Academy's Justice Task Force organization in pursuit of justice. But she's also in a financial crisis due to poor academic performance, which is somewhat out of character for a self-proclaimed elite. In reality, she has a goofy cute personality and has trouble keeping up with school lessons.\n\nKoharu also has a unique hobby of collecting pornographic magazines, and has a naive side that quickly inflates her imagination at the slightest provocation. These traits make her a laughingstock within the Justice Task Force, but no one can deny her genuine passion."

 #아비도스 고등학교
 ABY_Hoshino_advisor_desc: "$FROM_Abydos_Academy$\n\nAt first glance, Takanashi Hoshino, the only senior at Abydos High School and the spiritual leader of the task force, appears to be just a cute slacker who likes to sleep. Her laid-back demeanor makes her feel more like a cute junior than a senior. But when something confronts the love of her life, Abydos High School, and her juniors, she's tough and steadfast, as if she was never cute before. She will be strong. While she tends to be a bit emotional, her combat prowess overrides that recklessness, and even though she seems to be the kind of tough person who will crush anything that gets in her way, she can sometimes come off as a bit of a jerk. Even when her juniors ask her about it, she's evasive. What's the unspeakable story she's holding in her heart?"
 ABY_Shiroko_advisor_desc: "$FROM_Abydos_Academy$\n\nWhen you first meet Sunaookami Shiroko, a sophomore in the task force, you might not like her first impression. She may be beautiful and cute, and her calm, whispery, lilting voice may tickle your ears and draw you in, but she will quickly betray your expectations. She's energetic, has a stamina that no one can keep up with, and the outlandish opinions that come out of her mouth seem a million years removed from common sense, baffling even the task force that has known her for years. But that's often what makes her so appealing. Her unstoppable behavior as a sophomore is reminiscent of a spunky freshman, while her seasoned combat abilities make her feel like a battered sophomore. Perhaps that's why she's seen as a cute junior by Hoshino and Nonomi, and as a tough senior by Serika and Ayane."
 ABY_Nonomi_advisor_desc: "$FROM_Abydos_Academy$\n\nIzayoi Nonomi, a sophomore at Abydos High School, is one of the most senior students. Her positive, upbeat tone and behavior will always lighten the mood of the task force, even if it can sometimes be a little overwhelming. She also has a motherly presence on the task force, keeping everyone in line and preventing fights. She's also the snack manager on the task force, and is always there to keep everyone's spirits up. Meanwhile, she often pulls out what she calls her golden card. The Golden Card is supposed to be an unlimited card that you can buy everything with, so why didn't she use it to pay off Abydos High School's debt? Sometimes there are questions, but the task force doesn't dig deep. Maybe Hoshino would know."
 ABY_Serika_advisor_desc: "$FROM_Abydos_Academy$\n\nKuromi Serika, the youngest and cutest (?) girl at Abydos High School, she is often fooled by scam artists. Easily gullible and prone to blowing her hard-earned money, but also the most conscientious, she is the most instrumental in helping Abydos High School pay off its debts. She is the darling of Abydos High School, and while everyone has been very considerate of her, insisting that she only use the money she earns from her part-time job on herself and not to pay off their debts, she is secretly using her part-time job money to pay off the high school's debt. Serika can come off as strong and harsh at times when the seniors make ridiculous claims - mainly Shiroko - but deep down, she loves the task force more than anyone."
 ABY_Ayane_advisor_desc: "$FROM_Abydos_Academy$\n\nOkusora Ayane, the secretary of the task force, is the youngest, but she is the most mature among the seniors with a strong personality. To put it one way, you might think she's boring without personality, but in a sea of wacky seniors, her mediocrity makes her stand out. She often finds herself at the mercy of her seniors, and is often the only one with common sense in the task force, calling them out on their nonsense. At this point, you might be thinking that Ayane doesn't have any quirks outside of her normal life, but that's not the case. Hidden in plain sight, Ayane is the smartest of the group. Her ability to manage all of the money coming in and out of the task force, her resourcefulness in making more money than others with the same tools, and her ability to maintain all of the facilities at Abydos High School is something that no one else can replicate. She's also an all-around good girl who is often overshadowed by her seniors' overwhelming abilities, but whose stamina is also at the top of her game."

 # 붉은겨울 연방학원
 RED_trotsky_desc: "$FROM_RedWinter_Academy$§LLev Trotsky was a Bolshevik politician, revolutionary, Marxist theorist, and ideological founder of Trotskyism in Imperial Russia and the Soviet Union. Career-wise, he was a leading figure in the October Revolution and was instrumental in building the Soviet Union as the founder and leader of the Red Army. He was considered a possible successor to Vladimir Lenin, but lost a power struggle with Joseph Stalin, was expelled from the Soviet Communist Party and exiled from the country he founded. Since his exile, he has moved from exile to exile, criticizing Stalin's regime.§!\n\n§YHistory§! : §LHe was born in Yanovka, a small village in Yelisavetgrad County, Kherson Oblast, Russian Empire. His father, Davit Leontyevich Bronciteyn, was a Jewish Ukrainian from Poltava, and his family spoke Ukrainian. He was a pidgin surzhyk mixed with Russian. Trotsky's father was a rich farmer. When Trotsky was nine years old, he sent him to Odessa to study at a German Lutheran school. Odessa was a cosmopolitan city with many different ethnicities, which opened Trotsky's eyes to internationalism. This is in contrast to Joseph Stalin, who was thoroughly a Russian nationalist despite being Georgian. Trotsky excelled academically, graduating with great honor, and was fluent in English and French as well as German. In his autobiography, Trotsky described his language skills as mediocre, especially in English, but if you look at his English speeches, he seems to have no problem forming sentences, just awkward pronunciation.\n At the time, the Russian Empire was under the despotism of the Tsar, and revolutionary factions of various ideological backgrounds were springing up all over the country, imbibing revolutionary ideas from anyone who was even remotely interested. A mathematician by trade, Trotsky was initially a populist who sought to bring about a socialist revolution in traditional Russian thought, but was later influenced by Marxism. Trotsky's ideological transformation from conservative to populist and back to Marxist was very rapid.\n He joined the revolutionary movement as a student and played a leading role in organizing the workers of Nikolayev in southern Ukraine. From that point on, his organizational skills stood out. He was also a great public speaker, and after the February Revolution, when the coup forces of counter-revolutionary general Lavrov Kornilov entered the capital, Trotsky stopped them and gave a speech to the coup troops, which was so powerful that they disbanded themselves and Kornilov's coup failed. Lenin's writing was so good that he later wrote a book \"His writing is good, but it's a little too stylized.\". Robert John Service, a British historian known for his work on the Soviet Union, once remarked that even if Trotsky hadn't become a revolutionary, he would have made his mark on history as a writer or critic.§!" # 트리니티에 왜 꼽사리 껴있음?
