 #시리아 이벤트
 SYR_event.1.t:0 "독립"
 SYR_event.1.d:0 "우리 시리아 전역에 주둔하고 있던 프랑스군의 대부분이 본토로 복귀하여 이계의 존재와 싸울 때, 시리아인들은 행동했습니다!\n\n 노동자, 농민, 기업가, 종교인, 지식인들이 힘을 합하여 제국주의 압제 세력을 몰아내었고, 많은 희생이 따랐으나 1920년의 독립시도와 3년 간의 드루즈 봉기의 실패를 딛고 33년의 헌법 정지를 넘어선 채, 마지막 프랑스군이 시리아에서 철수하며 최종적인 독립을 이뤄냈습니다. 시리아인들은 환호하고 있으며, 새로운 국가를 구상하기 위해서 시민 사회는 분주합니다!"
 SYR_event.1.a:0 "해방 시리아 만세!"
 SYR_event.2.t:0 "[SYR.getname]의 경제 원조 요청"
 SYR_event.2.d:0 "프랑스의 식민통치에서 갓 벗어난 [SYR.getname] 정부는 해방 직후 경제 성장을 지원받기 위해 반제국주의 운동의 선봉인 우리 소련을 찾았습니다."
 SYR_event.2.a:0 "그들을 도와주자."
 SYR_event.2.b:0 "우리도 바쁜걸."
 SYR_event.3.t:0 "소련으로부터의 경제 원조"
 SYR_event.3.d:0 "소비에트 연방은 우리의 원조 요청을 수락하기로 하였습니다."
 SYR_event.3.a:0 "고맙군."
 SYR_event.4.t:0 "시리아의 산업 지원 요청"
 SYR_event.4.d:0 "[SYR.getname] 경제부처는 우리에게 경제를 지원해줄 것을 요청했습니다. 그들의 산업을 돕는 대가로 우리는 그들에게서 원하는 것을 얻을 수 있을지도 모릅니다."
 SYR_event.4.a:0 "솔깃하군."
 SYR_event.4.b:0 "그들과의 협력은 불필요하다."
 SYR_event.5.t:0 "[FROM.getname]의 수락"
 SYR_event.5.d:0 "[FROM.getname] 정부는 우리의 지원 요청에 응했습니다. 다만 우리는 그들이 원하는 대가를 치뤄야만 합니다."
 SYR_event.5.a:0 "고맙군."
 SYR_event.6.t:0 "[FROM.getname]의 거절"
 SYR_event.6.d:0 "[FROM.getname] 정부는 우리의 지원 요청을 거절했습니다."
 SYR_event.6.a:0 "아쉽군."
 SYR_event.7.t:0 "토지 개혁"
 SYR_event.7.d:0 "토지 개혁의 진행에 있어서 온건파와 급진파가 의견이 갈렸습니다. 우리 당의 온건파 세력은 농민들에게 우선 토지를 불하하여 1차 토지 개혁을 완료한 뒤, 훗날 생산력이 충분히 뒷받침됐을 때 농업 집단화를 실시하자고 제안합니다. 다른 한편, 당의 급진파는 이러한 자영농의 등장이 노동대중 전반에 불온한 소부르주아 사상을 촉진시킬 수 있으며, 이것이 반혁명으로 이어질 것에 대한 우려를 표하며 급진적인 농업 집단화를 주문합니다."
 SYR_event.7.b:0 "토지를 불하하자."
 SYR_event.7.a:0 "집단농업으로 나아가자!"
 SYR_event.8.t:0 "자유 선거"
 SYR_event.8.d:0 " 프랑스로부터 독립한 지 얼마 되지 않은 시리아를 이끌기 위해 200명의 직업과 계층을 불문한 시리아인들이 각 지역구에서 선출되었습니다. 이들은 다양한 배경을 가졌으며 종교인, 교수, 공무원, 지주와 같은 전통적인 엘리트부터 노조원, 학생, 빈민과 같은 하층민으로 여겨지는 이들로 구성되었습니다.\n\n 인민평의회에서 다수를 차지한 세력은 앞으로의 시리아를 정의하고 선언할 수 있으며, 그렇기 때문에 각 정당들은 각자 행동을 준비하고 있었지만, 시리아 독립 조약을 주도하고 지난 파업을 기획했던 국민블록이 높은 지지율로 정권을 가져왔습니다!"
 SYR_event.8.a:0 "공화 시리아 만세!"
 SYR_event.9.t:0 "직접 행동"
 SYR_event.9.d:0 " 시리아의 노동자, 농민, 빈민, 학생, 지식인 대중들이 일제히 파업에 돌입했습니다. 거리는 집회로 북적였으며, 공공시설은 계획된 습격에 의해 일제히 시위세력에 의해 점거되었습니다.\n\n 시리아-레바논 공산당은 민족평의회에서 노동대중의 요구를 적극 수용하며 해방된 사회주의 시리아로 사회를 재조직할 것을 선언했습니다."
 SYR_event.9.a:0 "혁명이다!"
 SYR_event.10.t: "왕실에 충성을 맹세한 [FROM.getname]!"
 SYR_event.10.d: "[FROM.GetAdjective]은(는) 우리 왕실에게 충성을 맹세했습니다."
 SYR_event.10.a: "고맙군."
 SYR_event.11.t: "영연방 가입 요청"
 SYR_event.11.d: "[FROM.getname](으)로부터 영연방 가입을 요청했습니다."
 SYR_event.11.a: "충성스러운 그들을 받아들이자."
 SYR_event.11.b: "그들은 준비가 되지 않았다."
 SYR_event.12.t: "[FROM.getname]의 거절"
 SYR_event.12.d: "우리의 제안은 거절되었습니다."
 SYR_event.12.a: "아쉽군."
 SYR_event.13.t: "시리아 총파업"
 SYR_event.13.d: " 지난 10여 년 간 진행되었던 시리아-레바논에서의 식민지배는 더 이상 지속될 수 없음이 자명해지고 있습니다. 시리아 총파업으로 거리는 진작에 마비되었고, 시리아 주둔군은 꽤나 큰 피해를 입고 있는 상황입니다. 설상가상으로 시리아 총파업은 주변 아랍 국가들의 동맹파업과 연대집회로 이어지고 있으며, 팔레스타인, 레바논, 요르단 등에서 유의미한 정치적 운동을 형성하고 있습니다.\n\n 원수 각하께서는 이와 같은 대치가 프랑스의 국익에 도움이 되지 않는다는 사실을 잘 알고 계십니다. 프랑스를 위해서라면 그는 말끔히 정장을 차려입은 채, 시리아와 열린 대화를 할 준비가 되있으십니다."
 SYR_event.13.a: "2보의 전진을 위한 1보의 후퇴다."
 SYR_event.14.t: "[SYR_mehemed_ali_abed.getname]의 사임"
 SYR_event.14.d: "약 4년동안 대통령직을 수행했던 [SYR_mehemed_ali_abed.getname]는 대프랑스 외교에서 너무 유화적이라는 비판을 가끔 받았지만, 그가 우리의 친애하는 독립운동가 중 한 명임은 분명합니다. 그는 독립 이후 신정권의 창출을 돕기 위해서 대통령직에서 사임할 것을 발표했으며, 자유 의회는 시리아 총파업을 기획하고 지시한 [SYR_hashim_al_atassi.getname]를 신임하였기 때문에, 그가 뒤이어 대통령직을 수행하기로 결정되었습니다."
 SYR_event.14.a: "새로운 대통령을 환영하자."
 SYR_event.15.t: "궐기"
 SYR_event.15.d: "나약한 의회민주주의는 더 이상 우리가 고려할 사항이 아닙니다. 용맹하고 깨어있는 장교단은 사회민족당과 손잡고 수도를 급습했습니다. 일부 저항이 있었으나 모두 무력화되었고, 끝내 정권은 탈취되었습니다. 다만, 농촌에서 우리의 이러한 행동을 묵인할지는 여전히 미지수입니다!"
 SYR_event.15.a: "궐기 만세!"
 SYR_event.16.t:0 "서방과의 우호"
 SYR_event.16.d:0 "비록 독립하긴 했으나 우리는 여전히 공산주의와 파시즘의 위협에 맞서 민주주의를 수호해야 하는 비탈길 위에 서있습니다. 서방과의 공조는 민족 감정에 앞서 민주정체의 수호를 위한 것입니다!"
 SYR_event.16.a:0 "사람들이 이걸 이해해줄까?"
 SYR_event.17.t: "키프로스 매입 요청"
 SYR_event.17.d: "[FROM.getname](으)로부터 키프로스를 매입하고자 요청이 왔습니다."
 SYR_event.17.a: "좋은 거래다."
 SYR_event.17.b: "무례하군."
 SYR_event.18.t: "[FROM.getname]의 최후통첩"
 SYR_event.18.d: "[FROM.GetAdjective] 정부는 동남부 영토를 요구하며 최후통첩을 보냈습니다. 이는 대부분 쿠르드족의 영토이지만 확실한 주권침탈입니다!"
 SYR_event.18.a: "평화보다 값진 건 없다."
 SYR_event.18.b: "무례하군!"
 SYR_event.19.t: "쿠데타!"
 SYR_event.19.d: "[SYR.gentame]의 사주를 받은 것으로 추정되는 파시스트 장교단이 쿠데타를 일으켰습니다."
 SYR_event.19.a: "신이라크 만세!"
 SYR_event.19.b: "저지해라!"
 

