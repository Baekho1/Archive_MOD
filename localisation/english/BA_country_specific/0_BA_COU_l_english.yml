 COU_getout_rin_decision:0 "린 탄핵"
 COU_getout_rin_decision_desc:0 "\n\n\n\n£GFX_COU_decision_picure_COU_norin\n\n\n\n\n\n\n\n\n§L"총학생회장이 사라진 이후에도 그녀의 그림자에 눌려 사람들의 의견을 귀담아듣고 절차대로 일을 진행하려 하다니... 그런 중우정치 같은 방법으로는 아무것도 해결하지 못합니다. 키보토스는, 초인에 의해 지휘되어야 합니다."§!\n\n§Y나나가미 린§!의 §R탄핵§!은 §Y린§!이 §Y총학생회장§!의 빈자리를 대신하여 나섰을 때부터 거론되었습니다. 철저한 원칙주의에 입각한 통치는 §Y시라누이 카야§!와 같은 이들에게서 큰 불만을 샀고, 그 갈등은 결국 §R탄핵§!이라는 §R마지막 싸움§!으로 번졌습니다. §Y카야§!는 §Y린§!을 §R탄핵§!시키기 위해 행동을 개시했습니다.\n\n그러나 §Y나나가미 린§! 또한 가만히 앉아 있지는 않을 것입니다. §Y린§! 또한 §Y카야§!를 §R총학생회에서 배제§!하기 위해 행동을 시작했으며, §R결국 이 싸움은 둘 중 누가 먼저 상대를 굴복시키는가에 달리게 되었습니다.§!\n\n§R그러나§! 단순히 빨리 한다고 이길 수 있는 것도 아닙니다. 총학생회에서 부상 등 기타 사유로 제대로 출석하지 못하는 이들을 제외한 §Y오키 아오이§!, §Y스모모§!, §Y하이네§!, 이 §Y세 명의 실장들§!의 §G지지§! 또한 얻어내야 합니다. §R만일 이들 중 단 한 명의 지지라도 받지 못한다면 탄핵은 실패로 돌아가고 말 것입니다.§!\n\n또한, §Y대중들의 탄핵에 대한 지지§!도 얻어야만 합니다. 언론과 매체를 가리지 않고 이들을 §G'계몽'§!시킴으로서 §Y린§!을 §G완전히 합법적이며 민주적인 절차§!를 통해 §R탄핵§!시키지 않는다면 §Y새 총학생회장§!은 §R좋지 않은 결말§!을 맞이하고 말 것입니다. 마치 프랑스 혁명 당시의 왕들처럼요."
 
 COU_rin_getout_kaya:0 "린의 선제 탄핵"
 COU_rin_getout_kaya_desc:0 "§Y나나가미 린§!은 §Y카야§!를 '총학생회 내부의 분열을 일으키며 현지인들과의 불법 거래와 범죄 방조 및 동조'라는 명목으로 실장들을 §R설득§!하고 있으며, §R만일 카야가 이에 적절하게 대하지 않는다면 카야는 패배할 것입니다!§!"


