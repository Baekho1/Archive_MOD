 BA_decisions_goverment_target: "[FROM.GetName] 정치 간섭"
 BA_decisions_goverment_target_desc: "우리는 키보토스 국가가 올바른 길로 나아가게 만들 책임이 있습니다. 그러기에 우리는 [FROM.GetName] 측이 길을 벗어나는 것을 용납할 수 없습니다."

 BA_decisions_defensive_war_target: "[FROM.GetName]의 침공에 대응"
 BA_decisions_defensive_war_target_desc: "대전이 이후 우리는 알 수 없는 국가들에게 둘러쌓였습니다. 이러한 상황을 타개하기 위해서는 외세의 침략에 대응하기 위한 연방의 결속이 필요합니다."

