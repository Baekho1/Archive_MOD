l_english:
#오프닝
 COU_country_intro_header: "하늘위에 군림했던 학생회"
 COU_country_intro_content: "본래 키보토스의 총학생회는 연방 전체의 행정을 통괄하는 거대한 규모의 정부였습니다. 각 학원 자치구간의 충돌을 중재하고, 연방을 평화롭게 이끌어나가는 것이 본래의 역할입니다.\n\n그러나, 우리의 위치를 하늘 위에서 떨어뜨린 이상 현상에 의해 총학생회는 위기에 놓였습니다. 우리가 맞이한 현실은, 모든 종류의 통신망과 교통망이 마비되었고, 다른 학원의 상태를 확인할 수 없다는 진실이었습니다.\n\n길고 긴 조사 끝에 우리가 찾아낸 진실은, 믿을 수 없게도 키보토스가 다른 세계로 전이되었다는 사실입니다.\n\n다행히, 우리는 D.U.라는 거대한 기반 도시를 가지고 이동되었기에, 상대적으로 상황이 매우 수월합니다. 그러나, 거대한 학원들이 자신들의 체제를 정비하고 기상하기 시작하면, 더 이상 막을 수 없게 될 것입니다.\n\n우리는 키보토스를 안정적으로 유지하고, 갈등을 잠재울 사명이 있습니다.\n\n§Y개발 - SKSKIe, YurizonoSeia§!"

 COU_guide: "목표\n\n총학생회의 혼란을 해결하십시오.\n총학생회장의 명령을 받은 인공지능 아로나를 통제하십시오.\n\n§Y철통같은 제국§! \n£white_dot. 권한 대행직을 장악하고 총학생회를 지배하십시오.\n£white_dot. 키보토스의 모든학원을 장악하십시오.\n£white_dot. 하나의 키보토스를 선포하십시오.\n\n§C정당한 대행의 학생회§!\n£white_dot. 폭풍 속에서 권한 대행의 자리를 지켜내십시오.\n£white_dot. 키보토스의 혼란을 잠재우고 새로운 미래를 밝혀내십시오.\n\n§R원하지 않던 자리§!\n£white_dot. 간단하게 시위 문제를 해결하십시오.\n£white_dot. 운명을 맞이하십시오.\n£white_dot. 그리고 자신이 만들어낸 미래를 지켜보십시오.\n\n§6키보토스의 안정을 복원하십시오.§!"

 COU_GATHERING_STORM_DESC: "수천 개의 크고 작은 학교가 모여 연방을 구성하고 있는 거대한 학원도시 키보토스의 중앙구에 위치하고 있는 키보토스 총학생회는 키보토스의 모든 중앙 행정시설을 통제하고 자치구 내에 존재하는 모든 학원 간의 분쟁, 정치 등을 조율하는 기관입니다.\n\n허나 대전이라고 불리는 재앙으로 인해 모든 것은 통제 불능의 상태로 빠져들었습니다.\n\n이 전대미문의 사태를 극복하기 위해 총학생회장은 어떤 선택을 하게 될까요?"

 COU_cut_tower_down_effect_tt: "§Y$COU_cut_tower$§! 국민정신의 효과가 감소합니다."
 COU_NOT_ARREST: "§Y[COU.ROOT.GetName]§!(은)는 억류되지 않음"
#초기 중점
 COU_establishment_of_emergency_measures_committee_1: "새로운 세계의 총학생회"
 COU_establishment_of_emergency_measures_committee_2: "키보토스 비상대책위원회"
 COU_establishment_of_emergency_measures_committee_1_desc: "키보토스 전역이 다른 세계로 전이된 초유의 사태에 우리는 강경하게 대응해야만 합니다. 총학생회장의 주도로 모든 종류의 수단과 방법을 동원하여 우리는 현지인들과의 전쟁에서 승리했고, 이어서 안정화를 해야만 합니다."
 COU_establishment_of_emergency_measures_committee_2_desc: "총학생회장이 행방불명되고 얼마 안 돼서 나타난 자칭 연방수사동아리 \"샬레\"는 총학생회장의 명령에 따라 총학생회가 샬레에 병합되어야 한다는 말도 안 되는 요구를 제시하고 있습니다. 이에 나나가미 린 수석행정관은 본인의 권한으로 총학생회장 권한대행을 맡음과 동시에 키보토스 비상대책위원회를 소집하기로 하였습니다."
 COU_establishment_of_emergency_measures_committee: "[COU_establishment_of_emergency_measures_committee_tt]"
 COU_establishment_of_emergency_measures_committee_desc: "[COU_establishment_of_emergency_measures_committee_desc_tt]"
 COU_question_about_acting_authority: "행정위원회의 반대"
 COU_question_about_acting_authority_desc: "일부 행정위원회 위원은 현 나나가미 린 수석행정관에 대해 부정적인 시각을 가지고 있습니다. 이는 수석행정관이 총학생회장의 행방불명으로 인한 상황 속에서 비상대책위원회 소집을 강행한 것에 대해 엉겁결에 인도받게 된 대행 권한을 남용하는 것 아니냐는 의견을 갖고 있기 때문입니다."
 COU_martial_measures: "비상 계엄"
 COU_martial_measures_desc: "앞선 여러 혼란으로 인한 학생들의 지속적인 동요로 인하여 비상대책위원회에서는 현 시간부로 키보토스 중앙구에서의 비상 계엄을 선포하기로 하였습니다."
 COU_crackdown_on_anti_kivotos_activities: "반키보토스 활동 단속"
 COU_crackdown_on_anti_kivotos_activities_desc: "아직 현지인 세력 중에는 우리가 전이해 온 것과 그로 인해 지역 정부가 붕괴한 것에 대해 적대감을 품고 우리에게 저항하는 자들이 많습니다. 우리는 해당 세력들을 단속하여 지역 안정화 증대에 이바지할 필요성이 있습니다."
 COU_political_intervention_of_SRT: "SRT와 접촉"
 COU_political_intervention_of_SRT_desc: "계엄령 시행과 동시에 우리 총학생회의 산하 특수부대인 SRT 특수학원과 접촉하여 대전이로 인해 인원수가 부족한 발키리 경찰학교 대신 지역의 치안을 담당할 수 있게 하자는 의견이 제시되었습니다."
 COU_expedited_administrative_processing: "신속한 행정 처리"
 COU_expedited_administrative_processing_desc: "현재 우리는 행정 마비로 인해 여러 혼란이 발생하고 있습니다. 이를 빠르게 해결하기 위해 행정 마비에 대한 복구를 우선시 하기로 결정하였습니다."
 COU_opening_of_local_culture: "현지 문화 개방"
 COU_opening_of_local_culture_desc: "일부 학생의 동요가 있을지도 모르지만, 현지인 세력과 조력을 위해 먼저 그들의 문화부터 알아야 한다는 의견이 제시되었습니다. 이는 우리에게 충분히 도움이 될지도 모릅니다."
 COU_expansion_of_autonomy: "자치 보장"
 COU_expansion_of_autonomy_desc: "우리는 환영받지 못하는 외지인이고 현지인들에게는 침략자로 보일 뿐입니다. 우선 그들에게 자치를 보장하여 불만을 낮출 필요성이 있습니다."
 COU_reduction_of_administrative_committee_authority: "현지 장교들과의 접촉"
 COU_reduction_of_administrative_committee_authority_desc: "반동적인 네덜란드인들은 제 여왕에 충정을 바치며 인도네시아로 도망쳤으나 부족한 레오폴드 3세의 지지는 결국 벨기에 장교들의 일부를 본토에 남기고 오는 결과를 낳았습니다. 그들은 자신들만의 사령부를 조직하여 우리와 협력하지 않고 있으나 그들은 분명히 우리에게 있어 큰 도움이 될 것은 분명합니다."
 COU_tooltip_unlock_dutch_belgium_generals:0 "§Y벨기에§!와 §Y네덜란드§! 출신의 §Y장교§!들과 §Y제독§!들, §Y조언가§!들이 §G사용 가능§!해질 것입니다."
 COU_establishment_of_human_rights_committee: "인권보장실 설립"
 COU_establishment_of_human_rights_committee_desc: "현재 게헨나와 트리니티가 있던 지역 \"독일\"이라는 국가는 과거 바이마르 헌법이라는 법률을 통해 각 개인 간의 권리를 명시했다고 합니다. 이를 이용하여 우리도 인권보장실을 설립해 학생이든 현지인이든 개개인이 마땅히 누려야 할 기본적인 권리를 누리게 합시다."
 COU_union_negotiation: "노동위원회 설립"
 COU_union_negotiation_desc: "우리를 위해 도와주는 현지인들을 위해 노동위원회를 설립하여 그들의 목소리를 들어야 할 필요성이 있습니다."
 COU_infrastructure_restoration: "기반 시설 복구"
 COU_infrastructure_restoration_desc: "현재 우리가 전이한 이세계의 철도망은 우리가 있던 키보토스의 철도망과는 상당히 다른 문제점이 존재합니다. 이를 일부나마 개선할 필요성이 있습니다."
 COU_establishment_of_federal_industrial_committee: "현지 기업들과의 접촉"
 COU_establishment_of_federal_industrial_committee_desc: "현지의 기업들은 대전이 이후 본국들에게 버려진 신세이지만 우리가 그들을 거두어 우리를 위해 일하게 할 수도 있습니다. 마땅히 그래야만 하고요."
 COU_tooltip_unlock_dutch_belgium_cons:0 "§Y잠겨진 설계사§!들이 모두 §G사용 가능§!해질 것입니다."
 COU_strengthening_of_valkyrie_authority: "경찰학교 권한 강화"
 COU_strengthening_of_valkyrie_authority_desc: "현 시국을 감안해 발키리 경찰학교의 권한을 강화하여 무기 사용 등 여러 제약에 관한 사항들을 해제할 필요성이 있습니다."
 COU_vertical_integration: "수직적 통합"
 COU_vertical_integration_desc: "일부 불만이 있을지도 모르겠지만 효율성을 위해 생산의 수직 계열상에 있는 여러 기업을 결합하여 비용 저렴화와 남는 공장을 재활용 할 수 있을 것입니다."
 COU_reorganization_of_administrative_committee: "부서 병합"
 COU_reorganization_of_administrative_committee_desc: "각 역할이 비슷한 부서끼리의 병합을 통해 우리의 행정 처리를 더욱 원활하게 처리할 수 있을 것입니다."
 COU_restructuring_of_defense_office: "방위실 재편"
 COU_restructuring_of_defense_office_desc: "방위실을 재편하여 우리가 필요로 하는 위치에 학생들을 적재적소로 투입할 수 있게 할 것입니다."
 COU_normalization_of_administration: "행정 정상화"
 COU_normalization_of_administration_desc: "여러 노력을 통해 행정 체계가 정상화되고 이윽고 마지막 작업만이 남았습니다. 우리는 권력 투쟁에서 주도권을 잡았으며, 총학생회는 이제 앞으로 나아갈 준비가 되었습니다.\n\n§g서로를 영원히 이해할 수 없을 것이기에 이해하지 못하는 것을 통해 우리들을 이해할 수 있을까?§!"
 COU_normalization_of_administration_tt: "현재 §Y권력 투쟁§!의 주축인 §Y시라누이 카야§!는 반대파들과의 권력 투쟁을 종료하진 못했으나, §Y샬레§!에 대한 반대는 합의하는 데 성공하였습니다."
 
 #우파
 ##tt
 COU_RIN_ARREST_tt: "§Y[COU.COU_RIN.GetName]§!(을)를 억류합니다."
 COU_MOMOKA_ARREST_tt: "§Y[COU.COU_MOMOKA.GetName]§!(을)를 억류합니다."
 COU_AYUMU_ARREST_tt: "§Y[COU.COU_AYUMU.GetName]§!(을)를 억류합니다."
 COU_HAINE_UNARREST_tt: "§Y[COU.COU_HAINE.GetName]§!(을)를 석방합니다.\n만약 §Y총학생회 재구축§! 혹은 §Y총학생회 습격§!을 완료하지 않았다면 이 중점을 완료한 이후부터 그녀는 억류되지 않을 것 입니다."
 HAINE_ARREST_TT: "§Y[COU.COU_HAINE.GetName]§!(을)를 억류합니다."
 COU_kudaeta2_tt: "§Y총학생회 재구축을 완료한다면..§!\n§Y[COU.COU_KAYA.GetName]§!(을)를 제외한 §Y총학생회§!의 주요 실장을 억류합니다.\n§Y총학생회 습격을 완료한다면..§!\n§Y[COU.COU_KAYA.GetName]§!(을)를 포함한 §Y총학생회§!의 주요 실장을 억류합니다."
 AOi_UNARREST_tt: "§Y[COU.COU_AOI.GetName]§!(을)를 석방합니다."
 COU_tooltip_kaya_started: "§Y[COU.COU_KAYA.GetName]§!가 §R왕좌를 위한 게임을 시작했습니다.§!"
 ##focus 
 COU_focus_in_the_darkness: "어둠 속에서 도사리며"
 COU_focus_in_the_darkness_desc: "..."
 COU_focus_remove_the_line: "린 불신임"
 COU_focus_remove_the_line_desc: "[COU.COU_RIN.GetName]은 총학생회를 이끌 자질이 되지 않습니다. 끝도 없이 유악한 그녀는 마음에 들지 않습니다. 린이 총학생회장 대행의 권위를 내세워 임원들을 굴복시킨다면 좀 더 일을 쉽게 처리하실 수 있으실 텐데. 그런데 그러하지 못하시지 않습니까? 대행의 권위는, 마땅히 [COU.COU_KAYA.GetName]에게 주어져야 합니다."
 COU_tooltip_kaya_started_game: "나약해빠진 §Y[COU.COU_RIN.GetName]§!의 §G탄핵을 위한 여정§!이 시작됩니다.\n§R그러나 명심해야 할 것은, 린 또한 이에 대응해 카야를 탄핵하기 위해 행동할 것이라는 점입니다.§!"
 COU_focus_arrest_momoka: "교통실 설득"
 COU_focus_arrest_momoka_desc: "명란맛 과자나 까먹는 머저리 [COU.COU_MOMOKA]는 교통실장으로서 린에게 충성합니다. 이러한 상황 속에서 카야는 친히 그녀를 찾아가 린 탄핵에 대한 찬성을 받아내고자 합니다."
 COU_focus_arrest_ayumu: "조정실 설득"
 COU_focus_arrest_ayumu_desc: "일을 빨리 하는 것 말고는 할 줄 아는 것이 하나도 없는 머저리 [COU.COU_AYUMU]는 교통실장으로서 린에게 충성합니다. 이러한 상황 속에서 카야는 친히 그녀를 찾아가 린 탄핵에 대한 찬성을 받아내고자 합니다."
 COU_focus_recruit_srt: "SRT 동원"
 COU_focus_recruit_srt_desc: "불쌍한 SRT, 그녀들은 대전이 이후 총학생회장이 사라지자 계속되어 방치된 상태에 놓였습니다. SRT는 그러한 대우를 받아야 할 아이들이 아니라고 카야는 말합니다. 그러한 뜻에서, SRT에게 제안을 한 가지 할 것입니다."
 COU_tooltip_srt_gonna_make_shit:0 "§YSRT와의 교섭§!이 §G성공§!한다면 그들은 §Y코우사기 공원§!에서 §R난동§!을 벌일 것입니다. 그들은 §L적당히 거슬리면서도 피해가 가지 않는 선§!에서 §Y린§!을 §G괴롭힐 것입니다.§! §R정말, 재미있겠지 않습니까?§!" 
 COU_focus_treaty_of_amsterdam: "디츨란드법"
 COU_focus_treaty_of_amsterdam_desc: "카야는 지속적인 네덜란드와 벨기에의 저항군들을 진정시키기 위해, 협력자들을 이용한 '디츨란트법'의 제정을 제안했습니다. 이는 상당히 유용한 제안일 것입니다."
 COU_focus_unarrest_mussert: "헤이턴 석방"
 COU_focus_unarrest_mussert_desc: "알프러트 헤이턴은 흑색전선을 장악한 거대한 정치적인 거물입니다. 헤이턴과 흑색전선은 막대한 영향력을 사회 전반에 끼치며, 흑색전선과 협력한다면 카야는 손쉽게 (아마도) 총학생회장 자리를 차지할 수 있을 것입니다."
 COU_focus_contact_with_flandern: "드그렐과 접촉"
 COU_focus_contact_with_flandern_desc: "플란데런과 왈로니의 충성스러운 파시스트들은 지배자들로부터 저항하며 애씁니다. 카야는 이들의 대표적인 수장인 레옹 드그렐과 접촉하여 플란데런의 하이랜더와 크로노스 스쿨을 장악할 계획을 한 가지 세웠습니다."
 COU_focus_the_shutup: "침묵"
 COU_focus_the_shutup_desc: "..."
 COU_focus_the_new_gscp: "총학생회장의 귀환"
 COU_focus_the_new_gscp_desc: "기존 총학생회장은 어디론가 사라져 영원히 돌아오지 않을 것임이 분명함에 따라 실장들은 카야를 새로운 총학생회장으로서 추대하기로 결정했습니다. 시라누이 카야는 새로운 총학생회장으로서 키보토스에서 총학생회장이 돌아왔다는 것을 마땅히 증명해보일 것입니다."
 

