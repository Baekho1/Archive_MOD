#총학생회 이벤트 - 시작
 COU_start_event.1.t:0 "학생자원방위대의 창설"
 COU_start_event.1.desc:0 "린은 걱정스러운 눈빛으로 생각에 빠져있었다. 평소라면 분명 커피를 마시며 업무에 집중했겠지만, 더는 무리다.\n\n린의 자리는 자신들의 사리사욕을 채우기 위한 욕심 가득한 이들의 손길에 위협받고 있었고, 동시에 키보토스 학생들을 상대로 한 살인과 폭력 범죄가 급증하고 있었다. 린은 총학생회장의 대행으로서 무언가를 해야만 했다.\n\n그때, 린 행정관의 머릿속에 한 총학생회의 주요 규칙 중 하나가 번뜩였다. "총학생회는 군사 조직을 가질 수 없다." 라는 규칙, 하지만 만약 이걸 어긴다면 어떻게 될까? 만약 이게 유일하게 옳은 길이라면, 규칙 하나쯤은 무시해도 되는 것 아닐까?\n\n그렇게 며칠 뒤, 린 행정관은 한 원통형의 보관함을 들고 기자들 앞에서 멈춰 섰다. 그러곤 린은 원통에서 한 깃발을 꺼내 들었다.\n\n"헌 시간부로, 우리 총학생회는 학원 자치권 보장법 2조항인 군사 보유 제한권을 공식적으로 해제하고, 준군사조직인 학생자원방위대의 창설을 선언합니다. 학생자원방위대의 주 수뇌부는 SRT 특수학원 출신자들이나 군사분야 전문가들로 구성할 예정입니다."\n\n린의 발언에 순식간에 기자들이 온갖 질문들을 쏟아내기 시작했고, 몇몇은 이미 그녀를 향해 욕을 퍼붓기 시작했다.\n\n하지만 린 행정관, 아니. 린 총학생회장의 눈은 이미 결심을 한 상태로 자신이 들고 있는 학생자원방위대의 공식적인 깃발에 고정됬다."
 COU_start_event.1.a:0 ""모두를 위해선, 이 방법밖에 없어.""
 COU_start_event.1.b:0 ""사병 조직은 월권 행위인걸 잊었나봐?""

 COU_start_event.2.t:0 "회의에서 퇴출당한 모모카"
 COU_start_event.2.desc:0 "이른 아침부터 모모카는 총학생회 사무국의 회의실로 불려 나갔습니다. 사무국 밖은 벨기에의 시위대로 가득해 아침부터 지원은 발키리 경찰학교의 학생들이 방패로 철저히 문들 틀어막으며 지키고 있는 모습이 유리창을 통해 비쳤다.\n\n모모카가 귀찮은 눈빛으로 회의실에 들어와 평소 항상 먹던 명란과자 봉지를 뜯으며 시위대의 요구사항을 들어봤지만, 그 어디서도 타협점이 보이지 않았다. 어떤 시위대는 벨기에의 독립을 원하고, 어떤 시위대는 자치권을 요구하기도 했다. 결국 모모카는 너무 난해한 요구사항에 그 어떠한 생각 없이, 그녀의 머릿속에 있던 말을 입 밖으로 꺼내버렸다.\n\n"그깟 요구, 그냥 들어주면 되는 거 아니야?"\n\n잠시 후, 모모카는 짜증 난다는 얼굴과 함께 사무국에서 쫓겨나듯 걸어 나왔다. 그렇게 시위대로 가득한 도심을 지나가며 다 떨어진 명란과자를 사러 가는 길, 하필이면 귀찮음 하나 때문에 총학생회 정복을 그대로 입고 온 모모카는 시위대에게 그녀의 정체를 들키고 말았다.\n\n귀찮아질 것 같다는 그녀의 예상과는 달리, 시위대는 그녀에게 원하는 걸 사줄 테니 총학생회가 어떤지 회의 내용을 흘려달라고 했다. 곧, 시위대로부터 과자 봉지들을 잔뜩 얻는 데 성공한 모모카는 그 자리에서 과자를 씹으며 이야기를 시작했다.\n\n"...솔직히, 여러들을 그렇게 좋게 보고 있지는 않는 것 같아요. 정치적 중립성을 유지해야 한다나 뭐라나, 린 행정관이 원래 깐깐한 건 다들 잘 알잖아요~ 음... 그런데, 솔직히 말하자면 그냥 여러분들 의견을 그대로 수용하는 게 제 아이디어였는데 글쎄, 절 쫓아내는 거 있죠?""
 COU_start_event.2.a:0 ""거기, 뭘 그렇게 열심히 쓰고 계시는거에요?""
 COU_start_event.2.b:0 ""시위대 말을 들어주라고? 웃기는 소리.""

 COU_start_event.3.t:0 "대충 아오이가 발키리의 지지 얻는 이벤트"
 COU_start_event.3.desc:0 ""
 COU_start_event.3.a:0 ""...""
 COU_start_event.3.b:0 ""...""

 COU_start_event.4.t:0 "왕좌의 게임"
 COU_start_event.4.desc:0 ""...그렇네요, 수석행정관이 결국 해버렸군요." 시라누이 카야는 의자에 걸터앉아 말했다. 근심이 가득한 얼굴로 곁에 올려진 커피를 마셨지만, 입가에는 미소가 걸려 있었다.\n\n멀쩡히 남아 있던 SRT를 버리고, 새로운 준군사조직을 만들었다? 린은 행동 하나하나마다 그 틈내가 훤히 들여다보이는 유리창 같았다. 비위 맞추는 입으로 떠들어대는 그 의도가 어떻게 되었던, 자기 밥그릇 지키고자 발악하는 것이겠지. 카야는 커피를 내려놓으며 TV를 켰다. 여타 예상했듯이 TV속 머저리들은 유식한 행세를 하며 린이 철권통치를 바란다느니, 린이 총학생회장의 자리를 노리는 것이라며 떠들어대고 있었다.\n\n하, 천만에. 얼빠진 수석행정관은 그럴 의도가 없다. 그저, 자기 밥그릇이 빼앗길까 봐 두려워하는 것이지. 커피잔을 밀어내고, 책상 서랍 속의 자그마한 체스판을 카야는 꺼내 보였다. 아마 곧 SRT의 아이들이 잔뜩 겁에 질린 채로 그녀에게 도움을 간청하리라고 그녀는 생각했다. 물론 그렇지 않을 가능성이 더 컸기에, 얕은 한숨을 쉬었다. 약해빠지게 되어서는 안 된다.\n\n체스판 위에는 퀸, 그리고 나이트 한 말 두 개만이 올려져 있었다. 린은 퀸, 그리고 그녀는 나이트였다. 그리고서는 폰 여덟 말을 꺼내 체스판의 앞에 놓았다. 왕좌의 자리를 건 체스 게임이 시작되었다. 카야는 폰 하나를 들고 책상을 두드렸다. 왕좌의 게임에서는 필연적으로 폰들이 필요했다. 그래야지만 퀸을 잡고 게임을 끝내리라. 그녀는 생각했다."
 COU_start_event.4.a:0 ""시간을 가지고, 기다려 보자고요.""

 COU_start_event.5.t:0 "교차"
 COU_start_event.5.desc:0 "시라누이 카야 방위실장은 체스판을 두드렸다. 수는 적었고, 가능성은 낮았다. 타개하기 위해서는, SRT가 필요했다.\n\n그러나 이내 굳게 닫힌 문 너머에서 급히 달려오는 발소리가 들렸다. 유레카. 확률낮던 그녀의 예상대로 들어맞았다. 발소리를 들어보니 한 명이었다.\n\n"방위실장! 문 좀 열어봐!" 시치도 유키노가 급한 목소리로 소리쳤다. 카야는 들고 있던 폰을 내려놓으며 문을 열었다. 본인은 아무것도 모른다는 표정을 한 채. "무슨 일로?" 그녀는 태연히 물었다.\n\n"무슨 일은... 무슨 일이긴! 넌 TV도 보지 않는 거야!" 꽤나 무례하지만 잔뜩 겁에 질린 목소리였다. 카야는 그 점이 마음에 들었다.\n\n"우선, 들어오시죠." 카야가 태평한 미소를 지으며 답했다. 퀸을 잡을 폰이 직접 도움을 간청하러 왔다- 그녀로서는 재미있는 일이었다. 그것도 아주 낮은 확률의 가능성이었는데 말이다.\n\n카야는 커피 포트에서 따뜻한 커피 두 개를 내려 책상에 올려놓았다. 유키노는 떨리는 손으로 커피를 받아서 들며 태연해지려 애썼지만, 미처 감출 수 없는 절박한 표정을 짓고 있었다.\n\n"알고 있습니다. 린 수석행정관이 SRT의 대체제를 만든 모양이더군요." 카야가 말을 뗐다. 마치 그 말을 기다렸다는 듯, 유키노가 재빨리 말을 이었다.\n\n"그래, 방위실장도 알고 있겠지만, 수석행정관이 기어코 저지르고 말았다고! 자기 휘하 특수부대로는 모자랐는지 어쨌는지, 우릴 숙청하려 드는 건지 어쨌는지!"\n\n"네, 그렇네요. 그리고 높은 확률로, 폭스 소대와 래빗 소대는 버려지겠죠. 아닌가요?"\n\n"잘 알고 있네! 방위실장의 도움이 필요해! 린 곁에 있었잖아, 그지? 그러면 린에게 창설을 취소해달라고 설득해 주면 안 될까? 사례는 뭐든 할게!"\n\n"죄송하게도 수석행정관은 완고하더군요. 기자회견이 끝나고 돌아가는 길에 이야기해 보았는데, 소용없었습니다."\n\n유키노의 표정이 절망적으로 바뀌었다."
 COU_start_event.5.a:0 ""그러나, 대안이 없는 건 아닙니다.""

 COU_start_event.6.t:0 "폰 여덟 개"
 COU_start_event.6.desc:0 ""그러나, 대안이 없는 건 아닙니다."\n\n유키노의 초점없던 눈에 초점이 다시 맞춰지고 카야를 바라보았다. 피식 웃음이 났다.\n\n"여기 퀸이 린, 그리고 나이트가 저라고 가정해 보죠."\n\n카야가 나이트를 옮겨 퀸의 코앞까지 움직여놓았다. 그러나 매번 옮길 때마다, 퀸에게 나이트는 허무히 죽어 버렸다. 그러나 폰 여덟 개를 집어 체스판 위에 가져다 놓았다. 나이트의 압승이었다.\n\n"SRT의 작은 도움이 필요합니다."\n"수석행정관은 SRT 출신자들로 학생자원방위대인지, 그걸 채우겠다는데, 뻔한 거짓말 아니겠습니까?"\n"그렇다면, 이제 SRT가 살아남는 마지막 방법은, 수석행정관이 마음을 바꾸거나, 뒤바뀌는 것뿐입니다. 그러나 수석행정관은 그럴 마음이 없어 보이더군요."\n"저도 SRT에 꽤 호감이 갑니다. 출중한 능력자들에, 멋진 특수부대죠. 그래서, 저는 묻고 싶습니다."\n\n카야가 폰 여덟 개를 내밀었다."
 COU_start_event.6.a:0 ""아무것도 하지 않다가 버려지시겠습니까,""
 COU_start_event.6.b:0 ""아니면, 살아남고자 발버둥치시겠습니까.""

#총학생회 이벤트
 COU_event.1.t:0 "유난히 조용한 날" #총학생회 실종 이벤트
 COU_event.1.desc:0 "그날은 그 어느 날보다도 조용한 날이었다.\n\n푸른 머리를 한 행정원은 그 어느 날처럼, 항상 그랬듯이 그날치 보고를 총학생회장에게 올려야 했다. 그다지 재미있거나 중요한 사안은 아니였다. 네덜란드인들이 파업을 진행하고 있다던가 등등등, 전부 진부하고 재미없는 이야기들 뿐이었다. 행정원은 그날따라 찬 바람이 부는 복도를 걸었다. 또각, 또각, 또각, 그런데 어째서인지 행정위원회의 본관으로 들어설 때 까지 그 어떠한 인기척도 느끼지 못했다. 1월이 갓 밝았으니, 추운 김에 숨이라도 돌리기 위해 산책이라도 나가셨을까? 그럴 리는 없다. 총학생회장님은 대전이 이후부터 한시도 쉬신 적이 없었다. 과로로 쓰러지실 뻔도 했다. 그러나 그러하기에 믿음직스러운, '어른'과 같은 이인 총학생회장님은 그럴 리가 없다며 한숨을 쉬었다. 좀 쉬셨으면 좋겠는데.\n\n긴 복도를 지나 큰 떡갈나무 문 앞에서 행정원은 문을 두드렸다. 똑똑. 인기척이 없다. 혹시라도 주무시고 계신 걸까? "총학생회장님? 오늘 자 보고입니다." 여전히 인기척이 없다. 하긴, 제대로 쉬신 적이 없으시니까.\n\n"대답이 없으면 들어가겠습니다." 처리해야 할 서류들 속에서 자고 있을 총학생회장을 깨우기 위해 행정원은 문을 열고 들어갔다. 그러나 행정원이 맞이한 것은 우스꽝스러운 자세로 쪽잠을 청한 총학생회장도, 눈을 감고 쉬고 있는 총학생회장도 아니었다. 그곳에는-"
 COU_event.1.a:0 ""...총학생회장님?""

 COU_event.2.t:0 "연방수사동아리"
 COU_event.2.desc:0 "총학생회장의 갑작스러운 실종 이후, 총학생회는 이후 벌어진 혼란을 제대로 알아차리기도 전에, 자신을 총학생회장의 마지막 유산이자, 연방수사동아리의 자율 인공지능 'A.R.O.N.A'라고, 소개하는 인공지능의 당당한 요구에 대처해야 했습니다.\n\n연방수사동아리는 총학생회장이 떠나기 전 만든 동아리라고 자신을 소개한 인공지능은, 총학생회장의 명령에 따라 총학생회가 샬레에 병합되어야 한다는 요구를 우리에게 전달했습니다."
 COU_event.2.a:0 "학생들이 동요하고 있어."

 COU_event.3.t:0 "[TRM.GetName]의 전쟁 고조"
 COU_event.3.desc:0 "미소노 미카의 집권 이후 [TRM.GetName] 측은 급격한 정치적 변화를 맞이하고 있습니다. 미소노 미카는 트리니티 학생들을 동요하고 고조시켜 게헨나를 향한 전쟁을 선포하기 위해 준비를 하는 것으로 보입니다.\n\n우리는 이것이 단순한 정치적 선전일지, 아니면 진정으로 우리의 적이 될지를 판단해야만 합니다."
 COU_event.3.a:0 "그녀는 매우 위험하다."
 COU_event.3.b:0 "우리는 그럴 능력이 없어."

 COU_event.4.t:0 "학생들의 선택"
 COU_event.4.desc:0 "샬레의 인공지능이 정치적 선전을 중단했고, 대다수의 학생들은 자신의 편을 정한 것 같습니다. 이제 우리는 다가오는 전쟁을 준비하고, 샬레와의 내전에서 승리해야만 합니다.\n\n총학생회의 영속과 키보토스의 안정을 위한 싸움이 다가오고 있습니다."
 COU_event.4.a:0 "시간이 더 필요해."

 COU_event.5.t:0 "노동조합 문제"
 COU_event.5.desc:0 "노동조합은 노동자 국가가 수립된 이후 역할이 거의 사라지고 중앙당과 충돌하고 있습니다. 노동자들은 일명 '생디칼리슴' 성향을 띄며 중앙당에 대한 반발감을 가지고 있고, 당의 혁명가들은 마르크스주의에 입각해 노동조합의 생디칼리슴 성향을 경계하고 있습니다.\n\n우리는 이제 노동조합의 처우를 결정할 필요가 생겼으며, 권위적으로 노동조합을 정부에 통합할지, 또는 위험을 무릅쓰고 노동조합과 노동자들에게 권력을 줄지를 결정해야 합니다."
 COU_event.5.a:0 "새로운 국가에는 새로운 형태의 노동조합이 필요하다."
 COU_event.5.b:0 "우리는 언제나 노동자 국가를 세울 것이다."
 COU_event.5.c:0 "모스크바는 답을 알고있다."
 
 #우파 
 COU_event.6.t:0 "협력자들의 처우"
 COU_event.6.desc:0 "대전이 이후 한 달이 지났습니다. 손쉽게 무너져내린 네덜란드와 벨기에 정부는 추잡스럽게도 그들의 국민들을 버리고 그들의 식민지로 도망쳤고, 남겨진 이들은 우리의 통치를 받게 되었습니다. 이러한 현실 속에서 몇몇 현명한 이들은 우리와 협력하기로 결정하였으며 우리의 통치를 도왔습니다. 그러나 신년으로부터 한 달이 지난 지금, [COU.COU_RIN.GetName]은 이러한 현상을 '키보토스 역설'이라고 언급하며 협력자들의 지위를 해제해야 한다고 언급했습니다.\n\n[COU.COU_RIN.GetName]에 따르면 협력자들이 그들의 지위를 사용해 다른 이들을 괴롭히고 착취한다며 한시라도 빨리 해제해야 한다며 이야기했습니다. 그러나 이와는 반대로 [COU.COU_KAYA.GetName]은 그녀의 말에 정면으로 반박하며 그들이 없다면 총학생회는 진작에 쫒겨났을 것이며 그들의 협력이 여전히 필요하다며 대립했습니다. 총학생회가 신년 이후에 겪는 첫 대규모 갈등에 실장들은 어찌할 바를 모르고 있으나 이러한 중대한 사안은 한시라도 빨리 해결되어야 합니다."
 COU_event.6.a:0 "[COU.COU_RIN.GetName]이 옳다."
 COU_event.6.b:0 "[COU.COU_KAYA.GetName]가 옳다."
 COU_tooltip_kaya_get_move:0 "§R이것은 [COU.COU_KAYA.GetName]가 행동을 개시할 명분이 될 것입니다...§!"
 COU_event.7.t:0 "정말 쉽지 않은 일"
 COU_event.7.desc:0 "도저히 이해 할 수가 없었고, 이해하고 싶지도 않았다. 나나가미 린은 도저히 현실을 볼 줄 몰랐다. 그저 아주 작은 한 조각에 모든 신경을 쏟고 있었다. 수석 행정관이라는 작자가 고작 눈물 몇 방울에 휘둘리다니, 이보다 더 한심한 인간은 키보토스에 존재할 수 없으리라, 카야는 생각했다. 린과 몇 시간이고 떠들어댔지만 멍청한 실장이라는 것들은 협력자들의 모든 지위를 박탈했다. 고마운 이들을 발키리에 수감시켰으며, 개미 새끼들의 환호에 취해 자화자찬하고 있는 꼴을 보자니, 헛웃음이 튀어나왔다.\n\n시라토리구의 자그마한 한구석, 그리고 한산한 구석의 방위실장 자리에서 카야는 다리를 꼬고 앉은 채 커피를 마셨다. 대전이 전에 가져왔던 마지막 커피였다. 유난히 맛이 더 썼다. 곁에 놓인 체스 보드 너머에서는 협력자들의 처분에 관한 멍청한 뉴스들이 흘러나오고 있었다. 저런 한심한 멍청이들, 머저리들... 화가 났지만 지금 당장으로서는 할 수 있는 것이 없었다. 그저 나지막히 '이용당한' 저들에게 용서를 구할 뿐이었다.\n\n쓴 커피가 바닥을 보였다. 그와 동시의, 카야의 인내심 또한 바닥을 보였다. 많이 참았고, 충분히 참았다. 총학생회장은 대전이 이후 혼란의 진정이라는 명목으로 아무것도 하지 않았고, 카야가 모든 것을 했었다. 협력자들을 모으고, 통치를 안정화하고, 저항군들을 진압하고, 그런 개 똥 같은 잡일 모두! 이를 갈았다. 더는 참을 수 없었다."
 COU_event.7.a:0 ""... 이젠, 그럴 수 밖에 없겠군요.""
 COU_tooltip_kaya_get_moved:0 "§Y[COU.COU_KAYA.GetName]§!의 시점에서 §Y[COU.COU_RIN.Getname]§!에 대항한 §R총학생회의 권력 투쟁§!을 시작하게 됩니다. §R그 권력 투쟁에서의 승리는, 오직 당신의 신속한 결단만이 매듭지을 수 있습니다.§!"
 COU_event.8.t:0 "한편으로는 갑작스럽게"
 COU_event.8.desc:0 ""그래서... 갑작스럽게 소집한 이유가 뭐야, 카야?"\n\n[COU.COU_AOI.GetName]가 먼저 말을 뗐다. [COU.COU_RIN.GetName]과 다른 실장들도 급작스러운 카야의 호출에 당황한 듯 보였다. 카야는 아무런 말도 하지 않았다. 린은 그러한 카야를 의심스러운 눈초리로 바라보았다. 아오이가 계속 그럴 거면 이만 돌아가겠다는 말을 꺼내기 직전, 카야는 입을 뗐다.\n\n"[COU.COU_RIN.GetName]의 권력을 위한 야망을 알려 드릴까 싶어서요." 린은 벙찐 채로 카야를 바라보았다.\n\n주목이 끌린 사이 카야는 말을 이어나갔다. "대전이 이후, 근처에 새롭게 만들어진 신생 조직, "연방수사동아리 샬레", 이 조직이 무슨 조직인지 아실련지요." 카야는 천천히 앞으로 걸어 나가 린을 가리켰다. "대전이 직후 창설된 수상한 조직, 그리고 대행은 그 조직이 무슨 조직인지 알려주려고 하지 않습니다. 그리고 모두가 아시다시피, 샬레는 총학생회장의 직속 기관이'었'습니다. 그렇기 때문에 샬레는 방위실, 체육실, 그 어떠한 부서보다도 높은 지위를 가지고 있습니다. 그리고 샬레의 실장은? 아무도 없습니다. 아무도 없는 초법적인 기관에, 그 정체는 아무도 모릅니다. 무언가 수상하지 않습니까?"\n\n깊은 정적이 내려앉았다. 체육실장 하이네는 동요하고 있었고, 재무실장 오키 아오이는 아무런 말도 하지 못했다. 린이 말을 꺼내 반박하려던 그 순간에, 카야는 먼저 말했다.\n\n"한편으로는 갑작스럽게, 그러한 불법적- 초법적- 정체 불명의 기관인 '샬레'를 동원하여 총학생회를 위협하는 [COU.COU_RIN.GetName]의 대행 권한에 의문을 표하고자 합니다." 카야는 말이 끝냄과 동시에 웃어 보였다."
 COU_event.8.a:0 ""그러면 부디, 현명한 선택을.""
 COU_tooltip_kaya_coueventeight:0 "§L카야는 천천히 문 밖으로 걸어 나갔다. 아오이는 그것이 사실인지 물었고 린은 말을 얼버무렸다. 실장들은 불안한 눈빛으로 린을 바라보았다.\n그것들이 정말 사실이라면. 의문점들이 곳곳에서 생겨났다.§!\n§Y린 탄핵 디시전§!이 활성화됩니다. 기본 §L대중 지지도§!는 §Y10§! 입니다."
 COU_event.9.t:0 "선제 탄핵"
 COU_event.9.desc:0 "짧고도 긴 권력 투쟁 끝에, [COU.COU_KAYA.GetName]는 [COU.COU_RIN.GetName]에게 결국 패배하고야 말았습니다. 카야는 총학생회를 불안에 빠뜨리고 방위에 대한 비리 혐의로 탄핵되었으며, 카야는 방위실장직에서 경질되어 방위차장이 방위실장의 대행을 맡고 있는 상황입니다.\n\n카야는 결과를 받아들이기 어려워하고 있지만, 결국 이 권력 투쟁에서는 린이 이겼습니다. 카야는 패배했으며, '총학생회장의 신뢰'를 얻던 인물에게 감히 대든 대가를 카야는 치르게 될 것입니다. 차디찬 발키리 조사실 지하와 감옥에서 말입니다."
 COU_event.9.a:0 "아, 이런."
 COU_tooltip_remove_kaya_contents:0 "§Y시라누이 카야 컨텐츠§!를 §R제거합니다.§!"
 

 ###총학생회 인물
 COU_XXX:0 "총학생회장"
 COU_XXX_desc:0 "그 어떠한 자들보다도 위에 서 있는 총학생회장은 키보토스에서 모든 것을 관리했습니다. 학원 간 분쟁, 그리고 사소한 다툼까지도, 모든 것을 관리하고 통제했으며 조정함과 동시에 중재했습니다. 그러나 그러한 총학생회장조차도 키보토스 전체가, 한 번도 들어본 적 없으며 실존하는지조차도 몰랐던 곳에 전이하게 되었을 때, 그녀는 모든 것을 짊어지게 되었습니다. 비록 원한 적은 없으나 모든 이들의 우두머리인 총학생회장은 그러해야만 했기에 그녀는 기꺼이 모든 것을 짊어지기로 결정했습니다. 그리고 그러한 고난 속에서 총학생회장은 더는 버틸 수 없게 될 때 까지, 그녀는 그녀가 가능한 한 키보토스를 위해 끝까지 일하고자 할 것입니다."
 COU_null:0 "키보토스 비상대책위원회"
 COU_null_desc:0 "총학생회장이 갑작스럽게 실종된 이후, 총학생회는 굉장한 혼란 속에 갇혀있습니다. 키보토스 총학생회는 현재 그 어떠한 활동도 할 수 없으며 이는 키보토스의 이상 상황에 전혀 대처할 수 없다는 것입니다."
 COU_RIN:0 "나나가미 린"
 COU_RIN_desc:0 "비상대책위원회 회의를 통해 앞으로 총학생회는 나나가미 린이 이끌게 되었습니다."
 COU_RIN_SET1:0 "수석 행정관"
 COU_AOI:0 "오키 아오이"
 COU_AOI_desc:0 "비상대책위원회 회의를 통해 앞으로 총학생회는 오키 아오이가 이끌게 되었습니다."
 COU_AOI_SET1:0 "재무실장"
 COU_KAYA:0 "시라누이 카야"
 COU_KAYA_desc:0 "카야는 명백하고 적법한 총학생회장이며 승리자입니다! 분명 그렇습니다! 그 누가 카야를 그 잘난 "승리자"라고 부를 수 없겠습니까? 모든 떨거지들을 떨쳐 내고 왕관을 차지했는데! 시라누이 카야는 처음부터 오직 그 생각이었습니다. 유약하고 나약해빠진 총학생회장을 끌어내고 자신이 그 왕좌에 앉는 것, 그것뿐입니다! 그리고 이제는 그 목표를 완전히 이루었으니, 어찌 "승리자"가 아닐 수 있습니까!\n\n...같은 말들은 카야를 심적으로 진정시켜 주는 역할을 합니다. 카야는 매일 아침 일어나면 보좌관에게 따뜻한 홍차 한 잔을 받아 마시며 자신은 초인이라고 되뇌입니다. 그렇지 않으면, 더는 버틸 수 없을 것이기 때문입니다. 시라누이 카야는 완벽히 오판했습니다. 같잖은 방위실장에서 처리하는 "같잖은" 일들은 총학생회장과는 완전히 달랐습니다. 권력에 눈이 멀어 총학생회장 자리를 찬탈했으나 감당하지 못할 직위는 저주이자 사슬입니다. 최소한 지금 당장은 그렇습니다. 왕관을 뺏어 썼으나 그 누구도 왕관의 권위를 인정하지 않습니다. 카야는 왕관의 무게를 느끼지 못합니다. 대체 어디서부터 잘못된 것일까요? 무엇이 틀렸던 것일까요? 사실은 처음부터 모두 그렇게 될 운명이었던 걸까요? 카야는 감당할 수 없는 수를 두었고, 후폭풍은 이제 오직 자신의 몫임을 실감하고 있습니다.\n\n빌어먹을, 초인이란 대체 무엇일까요? 대체 어떤 사람일까요? 그러나 그것이 무엇이던, 카야는 영원히 그렇게 되지 못할 것입니다- 아마도요."
 COU_KAYA_desc_upgraded:0 "시라누이 카야, 그녀가 누구입니까? 단순히 권력에 굶주린 사자일까요? 대부분의 이들이 카야를 권력에 굶주린 사자라고 묘사합니다. 물론 그것을 완전히 틀렸다고 말 할 수 없지만- 지금의 카야는 최소한 그렇지 않게 되었습니다. 분명히요.\n\n카야는 비록 총학생회장의 자리를 빼앗고자 오랜 야심을 품었지만 그러한 야심은 대전이까지는 이어지지 못했습니다. 암스테르담에 전이된 그녀는 처음에는 좋아했습니다. 분명히 나약해빠진 총학생회장은 사태를 완전히 통제하지 못할 것이고, 그렇다면 자신이 언제던지 총학생회장이 될 수 있을 것이라, 소박한 꿈을 꿈꿨습니다. 그러나 그러한 그녀의 자그마한 소원은 사회주의자들에게 짓밟혔습니다. 사회주의자들이 여왕의 도망을 축하하며 '파티'를 벌이던 그 날, 카야는 깨달았습니다. 시라토리구가 사회주의자들에게 습격당한 이후 카야는 깨달았습니다. 멍청이처럼 왕관을 뺏어 쓴다고 왕관의 무게까지 짊어질 수는 없음을요.\n\n카야는 깨달았습니다. 규칙에 얽매여서는 지킬 수 없는 정의가 있다는 것을. 어차피 멍청한 것들은 말을 해 보았자 알아먹지 않습니다. 힘들게만 살 필요는 없습니다. 적당히 일만 하고, 적당히 돈 받고 살면 그 머저리들은, 알아서 카야의 왕관을 받들 것입니다. 단지, 그렇게만 하면 되고, 그것뿐입니다."
 COU_KAYA_SET1:0 "방위실장"
 COU_AYUMU:0 "이와비츠 아유무"
