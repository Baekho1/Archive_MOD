 SLO_decisions_1_desc:0 "\n브라티슬라바 경제 협력 기구는 슬로바키아와의 무역 협정을 체결한 국가들로 이루어진 슬로바키아 중심의 소규모 국제 기구입니다.\n\n§Y가입국:§!\n[SLO.GetNameWithFlag][SLO_in_a_rom][SLO_in_a_yug][SLO_in_a_pol][SLO_in_a_hun]\n"
