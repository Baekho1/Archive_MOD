 SLO_cze_exile_idea:0 "체코인 망명자"
 SLO_economy_chaos_idea1:0 "경제적 혼란"
 SLO_economy_chaos_idea1_desc:0 "형제와도 같았던 체코는 이계인들에게 점령당했고, 서유럽 국가들 또한 그와 같이 되었습니다. 이러한 경제적 혼란을 우리는 극복해야 합니다."
 SLO_economy_chaos_idea2:0 "경제적 혼란"
 SLO_economy_chaos_idea2_desc:0 "형제와도 같았던 체코는 이계인들에게 점령당했고, 서유럽 국가들 또한 그와 같이 되었습니다. 이러한 경제적 혼란을 우리는 서서히 극복해나가고 있습니다."
 SLO_economy_chaos_idea3:0 "경제적 혼란"
 SLO_economy_chaos_idea3_desc:0 "형제와도 같았던 체코는 이계인들에게 점령당했고, 서유럽 국가들 또한 그와 같이 되었습니다. 이러한 경제적 혼란을 우리는 완전히 극복해나가고 있습니다."
 SLO_newborn_army_idea1:0 "신생 군대"
 SLO_newborn_army_idea1_desc:0 "체코슬로바키아군이 와해된 이후 급조된 슬로바키아군은 아직 와해된 체코슬로바키아군을 대체하지 못하고 있습니다."
 SLO_newborn_army_idea2:0 "신생 군대"
 SLO_newborn_army_idea2_desc:0 "슬로바키아군은 나날히 발전해나가고 있으나 아직 완전하다고 보기는 어렵습니다. 더욱더 진보해야 할 것입니다."
