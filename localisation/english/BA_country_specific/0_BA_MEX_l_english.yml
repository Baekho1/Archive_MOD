 # 인트로
 MEX_country_intro_header: "포르피리아토의 종말"
 MEX_country_intro_content: "1910년, 근대화 개혁을 이끈 대통령이자 폭군 §L포르피리오 디아스§!에 맞선 혁명의 불길이 피어나며 §L멕시코 혁명§!이 시작되었습니다. 포르피리오 디아스는 결국 프랑스로 도망쳤고, 그 사악한 영혼은 마침내 지옥불에 떨어졌으나, 그가 남긴 잔불, 즉 포르피리아토(Porfiriato)의 잔불은 여전히 멕시코의 민중들을 괴롭혔습니다.\n\n포르피리오 디아스가 물러난 이후 집권한 프란시스코 마데로는 멕시코 혁명의 주역이었던 농민들이 원했던 토지 개혁을 끝내 이루지 않았습니다. 우유부단함에 사로잡힌 프란시스코 마데로는 끝내 마누엘 몬드라곤 장군의 쿠데타를 허용하고 말았으며, 반란을 진압하기 위해 파견된 빅토리아노 우에르타 장군이 그를 배신하고 살해하며, 그렇게 빅토리아노 우에르타 장군의 집권이 시작되었습니다."
 MEX_country_intro_header_1: "로스 캄페시노스(Los campesinos)"
 MEX_country_intro_content_1: "빅토리아노 우에르타 장군을 향한 대중들의 분노는 굉장했습니다. 정치적으로 무능했을지 언정 대중들에게 꿀리지 않는 인기를 지니고 있었던 프란시스코 마데로 대통령의 죽음은 혼란을 불러일으켰으며, 포르피리오 디아스를 몰아냈던 에밀리아노 사파타와 알바로 오브레곤, 판초 비야가 다시 한번 일어나 빅토리아노 우에르타 정부에 맞서, 마데로 대통령의 고향이었던 베누스티아노 카란사를 대통령으로 하는 "호헌 혁명군" 을 조직했습니다.\n\n혁명군은 우에르타 장군을 궁지로 몰아넣었으나 미국 해군이 독일 선박의 무기 회수를 빌미로 대며 베라크루즈 일대를 장악하자, 수많은 멕시코인들이 우에르타 장군을 지지했습니다. 설상가상으로 혁명군 내부는 멕시코의 토지, 사회 개혁의 문제로 농촌의 사파타-비야 파와 도시의 카란사-오브레곤 파로 분열되기 시작했습니다."
 MEX_country_intro_header_2: "계속 되는 혁명"
 MEX_country_intro_content_2: "비야-사파타파와 카란사-오브레곤파의 전투에서, 당시 최신 전법이었던 대전쟁 당시의 전법을 도입한 카란사-오브레곤파에게 비야-사파타파가 패배하고, 에밀리아노 사파타가 암살당하면서 카란사-오브레곤파는 승리를 거두었으나, 카란사파가 내부적으로 분열되기 시작했습니다.\n\n비야-사파타파의 주장을 받아들일 생각이 없었던 카란사와 달리 실질적으로 혁명에 참가한 장군들과 병사들은 그들의 주장을 대부분 받아들였으며, 이는 카란사와 장군들간의 갈등이 되었습니다. 카란사 스스로가 대통령이 되어 집권했을 때에도 1917년 세워진 헌법을 무시하고 집권을 이어나갔으며, 카란사가 자신의 파벌 아래에 있던 정부군 장교에게 암살당하며 그렇게 홀로 남은 오브레곤과 그의 파벌이 승자가 되었습니다.\n\n오브레곤은 비야-사파타파와의 평화협상을 시작했습니다. 이후에 벌어진 포르피리오 디아스에게 지지를 보내던 가톨릭 사제들, 크리스테로와의 전쟁을 제외하면 멕시코는 상대적으로 평화로운 시기를 보냈습니다."
 MEX_country_intro_header_3: "혁명을 완수하라"
 MEX_country_intro_content_3: "혁명 이후, 오브레곤파에 속해있던 혁명 지도자 플루타르코 카예스는 멕시코 혁명 기간동안 살아남은 지도자들을 모아 세워진 국가혁명당을 세웠습니다.\n\n카예스는 암살당한 오브레곤의 뒤를 이어 독재를 시도했으나, 라사로 카르데나스에 의해 그 시도가 좌절되었습니다. 카예스는 도망자 신세가 되었으며, 라사로 카르데나스는 1934년 부터 집권을 시작해 멕시코의 발전에 박차를 가하기 시작했습니다."
 MEX_country_intro_header_4: "로스 키보토스"
 MEX_country_intro_content_4: "그러나 그들 앞에 예상치 못한 이들이 나타났습니다. 유럽에 키보토스라는 이계인들이 처들어오기 시작했고, 그렇게 수많은 유럽인들이 자신들의 고향을 잃고 세계 각지로 향하기 시작했습니다. 멕시코 또한 그 국가들중 하나였으며, 이미 수많은 유럽인들이 멕시코를 향해 피난을 떠났습니다.\n\n내부적으로는 심각한 문제를 겪고 있습니다. 사투르니노 세디요 장군은 멕시코의 중앙집권화를 시도하는 라사로 카르데나스의 결정에 크게 반발하고 있으며, 언제든 카르데나스 정부를 뒤엎을 준비를 하고 있습니다. 뿐만아니라 미국과의 무역이 대폭 감소한 멕시코에게 유럽이라는 시장의 상실은 치명타로 다가왔습니다.\n\n대공황에 벗어나지 못한 멕시코의 운명은 어떻게 될까요? 어쩌면 독재자 포르피리오 디아스 조차도 알지 못할 것입니다."

 # 가이드
