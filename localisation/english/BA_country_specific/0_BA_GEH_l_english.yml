 # 챕터 : 2
 GEH_Conquer_the_Central: "중앙구 공세"
 GEH_Conquer_the_Central_desc: "선도부가 중앙구를 장악하기 위한 계획중인 군사 작전중 하나입니다. 만마전의 권력 중심부를 직접적으로 타격하여 적의 사기를 꺾고 전략적 우위를 확보하는 것을 목표입니다."
 GEH_Officer_Appeasement: "임원 회유"
 GEH_Officer_Appeasement_desc: ""
 GEH_no_more_Heer: "규율 강요"
 GEH_no_more_Heer_desc: "우리는 선도부에서 복무하는 학생들에게 규율을 지키고 민사 규칙을 적절히 따르도록 해야 합니다. 선도부가 강력한 전투력과 규율과 존경을 받을 수 있는 부대라는 명성을 얻도록 해야 합니다."
 GEH_get_legitimacy: "정통성 확보"
 GEH_get_legitimacy_desc: ""
 GEH_get_legitimacy_trigger_tt: "@GEM§Y[GEM.GetName]§!(이)가 @GEA§Y[GEA.GetName]§!(과)와 통합됨"
 GEH_focus_8: "대공세"
 GEH_focus_8_desc: ""
 GEH_Securing_supplies: "물자 확보"
 GEH_Securing_supplies_desc: ""
 GEH_Armoury_Raid: "무기고 급습"
 GEH_Armoury_Raid_desc: ""
 GEH_Pandemonium_Society_Building_Control: "대중을 집결시켜라"
 GEH_Pandemonium_Society_Building_Control_desc: "선도부는 만마전의 폭정을 끌어내리도록 대중들을 이끌어야 합니다. 학원의 학생을 규합하여 혁명에 참여하도록 만듭시다!"
 #챕터 3
 GEH_first_congress_focus: "제3차 선도부 총회"
 GEH_first_congress_focus_desc: "선도부는 모든 역경을 딛고 혼란스러운 키보토스의 정치 상황에 강력한 존재감과 함께 나타났습니다. 수많은 선도부원은 선도부 총회를 개최하여 미래에 대비하고 게헨나를 변화시켜야 한다고 목소리를 높히고 있습니다."
 GEH_Army_Reformation: "실행부 개편"
 GEH_Army_Reformation_desc: "실행부는 현재 게헨나에서 국방을 담당하는 부서입니다. 지난 만마전과의 전쟁에서 실행부에게 큰 결점이 드러났습니다."
 GEH_Leverage_Perfect_team_strengths: "실행부 전문화"
 GEH_Leverage_Perfect_team_strengths_desc: "실행부를 정예화 시켜 한 명 한 명 정예 인력으로 길러 낸다면 게헨나 학원의 군사력도 대폭 증가할 것입니다."
 GEH_army_focus_tt: "§g강력하지만 적은 인력을 기반으로하는 군사 개혁 중점입니다.§!"
 GEH_army_focus_2_tt: "§g특색이 없지만 무난한 군사 개혁 중점입니다.§!"
 GEH_look_to_the_west: "전쟁의 교훈"
 GEH_look_to_the_west_desc: ""
 GEH_Gehenna_Rebuilding: "기획부의 계획"
 GEH_Gehenna_Rebuilding_desc: "기획부장인 아마우 아코가 계획한 경제 계획은 주먹구구식으로 굴러가던 게헨나 경제에 큰 도움이 될 것입니다. 기획서는 이미 선도부장에게 전해졌습니다."
 GEH_approve_plan: "예산 배정"
 GEH_approve_plan_desc: "선도부장은 아마우 아코의 경제 계획을 승인하였고 적절한 예산을 배정 받았습니다. 철저하고도 완벽한 계획 아래에 아마우 아코는 게헨나 경제를 부흥 시킬 것입니다."
 GEH_first_five_year_plan: "1차 5개년 계획"
 GEH_first_five_year_plan_desc: "평화가 지속되는 동안 우리는 계획에 맞춰 산업화를 더욱 빨리 추진해야합니다."
 GEH_nationalise_railways: "게헨나 철도"
 GEH_nationalise_railways_desc: "게헨나를 잇고 있는 것은 도로가 아닙니다. 철도 또한 게헨나의 생명줄입니다. 지난번의 전쟁으로 크게 파손 되었으니 고쳐야 합니다."
 GEH_factory_focus_1: "버려진 공장 재활용"
 GEH_factory_focus_1_desc: "게헨나 서구를 조사하던 중 강을 따라 이어진 곳에 수많은 공장이 있는 것을 발견하였습니다. 이를 활용한다면 크게 도움이 될 것입니다."
 GEH_factory_focus_3: "국방 기금"
 GEH_factory_focus_3_desc: ""
 GEH_factory_focus_4: "중공업 재편"
 GEH_factory_focus_4_desc: "중공업을 발전 시키는 과정에서 비효율적인 부분이 발견 되었습니다. 전부 통폐합의 과정을 거친다면 더욱 효율적으로 변할 것입니다."
 GEH_factory_focus_6: "생산량 증대"
 GEH_factory_focus_6_desc: "게헨나만의 생산 방식은 다른 학원들을 초월할 수 없습니다. 새로운 생산 방식을 시행하고 새로운 기술을 도입하면서 다른 학원과 비슷하거나 추월해야 합니다."
 GEH_control_market_investment: "관제 시장 투자"
 GEH_control_market_investment_desc: "아마우 아코와 기획부의 주도 아래 관제 되는 시장 투자를 활성화하여 국내 자본을 선도부에 종속시키고 유연한 시장 구조를 형성할 것입니다."
 GEH_prefect_team_priority: "선도부 우선"
 GEH_prefect_team_priority_desc: "모든 경제정책은 결국 선도부와 선도부원을 위해 운영되어야 한다는 본분을 잊어버리는 행동을 해서는 안 됩니다. 우리는 경제정책에 있어서 선도부의 운영을 최우선 사항으로 고려할 것입니다."
 GEH_vertical_integration: "수직적 통합"
 GEH_vertical_integration_desc: "선도부의 최적화된 관료제하에 여러 경제 프로그램을 진행할 것입니다. 산업의 수직적 통합과 중앙 관제를 통해 여러 반면에서의 효율적인 경제 구조를 형성할 것입니다."
 GEH_Cooperation_with_HID: "정보부"
 GEH_Cooperation_with_HID_desc: "정보는 모든 방면에서 도움이 됩니다. 첩보부를 격상시켜 많은 권한을 준다면, 그들이 주어진 일을 제대로 해낼 것입니다."
 GEH_hit_wehrmacht: "국방군 공격"
 GEH_hit_wehrmacht_desc: "국방군은 암과 같은 존재입니다. 최대한 빨리 제거해야합니다."
 GEH_hit_wehrmacht_2: "주 정부 인수"
 GEH_hit_wehrmacht_2_desc: "독일의 주 정부를 인수해 선도부의 행정 부담을 약화시키고 지방 정부에 대한 통제력을 손쉽게 확보할 수 있을 것입니다."
 GEH_HID_benriya: "흥신소 문제"
 GEH_HID_benriya_desc: "흥신소는 넘지 말아야 할 선을 넘고 말았습니다. 시로미 이오리 습격 사건은 게헨나 학원과 선도부의 안보를 위기에 처할 정도로 끔찍한 사건입니다. 그들을 토벌해야 합니다."
 GEH_HID_trinity: "어둠 속의 눈"
 GEH_HID_trinity_desc: "선도부가 만마전을 꺾어내었다고 하여도 아직 내부에는 만마전과 유통한 사람이 존재할 수 있습니다. 보이지 않는 곳에서 그들을 감시하고 기록해야합니다."
 GEH_HID_millennium: "군 감시제도"
 GEH_HID_millennium_desc: ""
 GEH_preventive_attack: "'예방전쟁'"
 GEH_preventive_attack_desc: ""
 GEH_Army_focus_1: "장비 개량"
 GEH_Army_focus_1_desc: "전쟁의 경험을 되살려 더욱 진보한 무기를 만들어야합니다."
 GEH_Army_focus_3: "야포 개발"
 GEH_Army_focus_3_desc: "전쟁에서 선도부의 문제는 화력이 부족하다는 점이였습니다. 야포를 개발한다면 문제를 해결할 수 있습니다."
 GEH_Army_focus_2: "적응"
 GEH_Army_focus_2_desc: ""
 GEH_DNVP_focus_3: "[GEH_DNVP_focus_3_text]"
 GEH_DNVP_focus_3_1: "실행부 확대"
 GEH_DNVP_focus_3_1_desc: ""
 GEH_DNVP_focus_3_2: "정예화 가속"
 GEH_DNVP_focus_3_2_desc: ""
 GEH_Army_focus_5: "정예 핵심"
 GEH_Army_focus_5_desc: "수많은 선도부원들이 있지만 혁명전쟁에 참여한 인물들은 극 소수에 불과합니다. 이로써 우리가 알 수 있는 점은 많은 수의 인원을 전장에 쏟아붓는건 비효율적이라는 것과, 정예 인원들의 체계적인 육성이 그 무엇보다 중요하다는 사실입니다. "
 GEH_prefect_army_focus_2: "제병합동"
 GEH_prefect_army_focus_2_desc: "신속하고 유기적인 지휘체계의 협동은 신세계의 전장에서 가장 부대 손실률이 적은 성과를 보였습니다. 아직 시험 단계인 제병협동을 신속히 도입해야합니다. "
 GEH_prefect_army_focus_3: "철저한 총참모부 교육"
 GEH_prefect_army_focus_3_desc: "선도부의 전투력은 선도부장의 무력과 지휘에만 의존하는 기형적인 구조를 가지고 있습니다. 체계적인 교육을 통해 선도부장의 전술적 판단을 학습하고 적용한다면 선도부장의 부재시라는 위급상황에서도 어느정도 대처할 수 있을 것입니다."
 GEH_prefect_DNVP_focus_3: "선도부 전쟁청"
 GEH_prefect_DNVP_focus_3_desc: "선도부의 정예화를 추진하는 우리의 계획은 성공적으로 이뤄지고 있습니다. 각 전쟁에서 두각을 보이는 학생들을 지원하기 위해서, 선도부에서는 전쟁청을 만들어 이들을 전폭 지원하기로 결정했습니다."
 GEH_Army_focus_6: "징병 확대"
 GEH_west_army_focus_2: "새로운 병과의 활용"
 GEH_west_army_focus_3: "실행부와 기획부 접목"
 GEH_west_DNVP_focus_3: "\"적응\""
 GEH_Army_focus_7: "전장의 여왕"
 dldhfl_flag: "$BA_news.52.t$"
 #챕터 4
 GEH_Trinity_war: "트리니티와의 전쟁"
 GEH_Trinity_war_desc: "전쟁이 발생하였습니다. 적들이 게헨나를 침공하기 시작하였고 우리 군대는 기습을 당하여 패퇴하고 있습니다. 전열을 가다듬고 반격의 때를 기다려야합니다."
 GEH_war_factory_focus_1: "군수시설 확장"
 GEH_war_factory_focus_1_desc: "전쟁을 진행하던 중 게헨나 국가는 전쟁을 지속할 역량이 부족하다는 것을 알아차렸습니다. 지금이라도 확장하여 장기전을 수행할 역량을 키워내야합니다."
 GEH_war_factory_focus_3: "지하 산업"
 GEH_war_factory_focus_3_desc: ""
 GEH_war_factory_focus_4: "게헨나 야포"
 GEH_war_factory_focus_4_desc: "게헨나의 포 제조사가 직접 개량한 게헨나만의 야포입니다. 다른 야포와의 차이점은 화력이 강하다는 점입니다."
 GEH_war_focus_2: "선전부 창설"
 GEH_war_focus_2_desc: "선전부를 창설하여 전쟁 도중 선도부의 업적을 홍보하고, 선도부에 대한 지지를 확대해야 합니다.."
 GEH_war_focus_3: "게헨나 수호 집중"
 GEH_war_focus_3_desc: "우리의 그 어떤 목표보다 중요한 목표는 게헨나를 수호하는 것입니다.."
 GEH_unlimited_conscription: "징병 제한 제거"
 GEH_unlimited_conscription_desc: ""
 GEH_chinatsu_focus_1: "의료부 격상"
 GEH_chinatsu_focus_2: "의무 부대"
 GEH_chinatsu_focus_5: "의료 활동 지속"
 GEH_chinatsu_focus_3: "전선 병원"
 GEH_chinatsu_focus_4: "전선의 어머니들"
 GEH_war_focus_7: "게헨나 방어 계획"
 GEH_war_focus_8: "게헨나 수복 계획"
 GEH_war_focus_9: "트리니티 공세 계획"
#챕터5
 GEH_three_congress_focus: "제4차 선도부 총회"
 GEH_three_congress_focus_desc: "파도가 휩쓴 자리에는 두 발을 딛고 서있는 선도부와 게헨나가 남아있었으며, 어느새 키보토스에서의 하루가 까마득히 먼 옛날이 되었습니다.\n수많은 선도부원들이 제4차 선도부 총회를 개최해야 한다며 목소리를 높히고 있습니다. 그리고 이 총회에서 우리들의 미래가 정해질 것입니다."
 GEH_three_congress_focus_trigger: "§Y$GEH_Army_Reformation$§! 중점의 아래 중점 계통도 3개 이상 완료"
 GEH_three_congress_focus_tt: "§C소라사키 히나는 더 이상 무너지지 않습니다.§!"
 GEH_three_congress_focus_no_hina: "선도부장이 없는 하루"
 GEH_three_congress_focus_no_hina_desc: "불길한 어둠이 감도는 긴 밤이 지나고. 일어나선 안 될 일이 일어났습니다.\n소라사키 히나 선도부장님이 현재 부재중인 상황이기에. 우리는 다급하게 문제를 해결해야 합니다."
