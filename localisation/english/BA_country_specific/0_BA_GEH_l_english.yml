l_english:

 GEH_hina_name: "소라사키 히나"

 #게헨나
 GEH_country_intro_header: "어둠 속의 질서"
 GEH_country_intro_content: "게헨나 학원은 제대로된 교칙 하나 없어 학생들의 등교 시간은 제멋대로고 학원은 별것도 아닌 것으로 폭탄테러를 일으키거나 동아리들 끼리 갈등을 일으키는 등 혼돈만이 가득할 뿐입니다. 하지만 그나마 우리, 선도부가 존재하기 덕분에 질서유지가 겨우 되고 있지만 문제가 많습니다.\n\n만마전과 선도부의 갈등은 언제부터였을까요? 어느새 그 갈등의 골은 깊어져 이제는 서로 돌아올 수 없는 길을 건너고 말았습니다.\n\n키보토스가 이계로 오면서 게헨나에는 더욱 크나큰 혼돈이 찾아오기 시작하였습니다. 만마전의 행정은 더욱 혼란해지고 있으습니다. 이계로 버려진 지금 우리는 상황을 파악하기 위하여 안간 힘을 쓰고 있으며, 만마전은 늦었지만 원인을 찾기 위해 노력중입니다.\n\n오직 당신의 선택만이 이 혼돈을 끝낼수 있을 것입니다.\n\n§Y개발 : Kangseul2702, SKSKIe§!"
 GEH_guide: "\n£white_dot 국방군의 협상안을 거부하십시오\n£white_dot 만마전과의 내전에서 승리하십시오\n£white_dot 학원을 정상화 시키십시오\n£white_dot 에덴 조약을 성사하십시오.\n\n\n§R피로써 그 모든 것의 마침표를 지으십시오.§!"
#
#게헨나 히나 
 # 프롤로그
 GEH_start_focus: "철인의 길"
 GEH_start_focus_desc: "결국, 선도부는 해당 사태에 대비해야 합니다. 아니, 소라사키 히나는 해당 사태를 책임지고 수습해야만 합니다. 그렇지 않다면, 소라사키 히나와 그를 믿고 따르는 수많은 게헨나의 학생들의 이상과 선도부 임원들의 운명을 꺾어버리는 것일 뿐입니다. 그러기에 소라사키 히나는 밖으로 나와야만 합니다."
 GEH_zero_congress_focus: "제1차 선도부 총회"
 GEH_zero_congress_focus_desc: "사태가 어느정도 진정되고 노력끝에 일상을 되찾아가고 있습니다. 선도부원들은 우리의 미래를 정하기 위해 총회를 개최하고 향후 계획을 세워야 한다고 목소리를 높히고 있습니다."
 GEH_Nuremberg_Wehrmacht: "뉘른베르크 수색"
 GEH_Nuremberg_Wehrmacht_desc: "정보부의 정보에 의하면 뉘른베르크에 국방군 잔당이 비밀리에 활동하고 있다고 합니다. 도시를 샅샅히 뒤져봐야 합니다."
 GEH_Regensburg_Wehrmacht: "레겐스부르크 수색"
 GEH_Regensburg_Wehrmacht_desc: "정보부의 정보에 의하면 레겐스부르크에 국방군 잔당이 비밀리에 활동하고 있다고 합니다. 도시를 샅샅히 뒤져봐야 합니다."
 GEH_focus_111111: "되찾은 안정"
 GEH_focus_111111_desc: "국방군 잔당들을 모조리 무장 해제함으로써 우리는 위협에 시달리지 않게 되었습니다. 외부의 위협이 없는 한 우리는 계속 안전할 것입니다."
 # 챕터 : 1
 GEH_Prefect_Team_muster: "선도부 소집"
 GEH_Prefect_Team_muster_desc: ""
 GEH_focus_can_only_be_completed_by_focus_tt: "이 중점은 §Y$FOCUS$§! 중점이 진행되는 도중 자동으로 시작될 수 있습니다."
 GEH_rework_focus_1: "기획부"
 GEH_rework_focus_1_desc: "아마우 아코가 이끄는 기획부는 선도부의 행정과 전략 수립을 담당하는 핵심 부서입니다. 이들은 뛰어난 서류 작업 능력을 바탕으로 선도부의 운영을 체계화하고, 다양한 작전과 정책을 수립하여 선도부의 효율적인 운영을 지원합니다."
 GEH_rework_focus_2: "의료부"
 GEH_rework_focus_2_desc: "히노미야 치나츠가 이끄는 의료부는 선도부의 의료 지원을 담당하는 중요한 부서로, 전투 인원의 치료와 건강 관리를 전문적으로 수행합니다"
 GEH_rework_focus_3: "실행부"
 GEH_rework_focus_3_desc: "시로미 이오리가 지휘하는 실행부는 선도부의 군사력을 관리하고 전투 훈련을 담당하는 핵심 부서입니다. 이들은 엄격한 훈련 프로그램을 통해 선도부원들의 전투 능력을 향상시키고, 필요시 신속하고 효과적인 군사 작전을 수행하여 선도부의 안전과 목표 달성을 보장합니다."
 GEH_fear_eyes: "풍기집행"
 GEH_fear_eyes_desc: "만마전이 우리를 적대시함은 확실해졌습니다.\n이렇게 된 이상 게헨나의 가장 문젯거리였던 만마전에게 \"풍기집행\"을 할 때가 되었습니다."
 GEH_fear_eyes_tt: "우리는 $GEH_operation_countenance$ 시작과 동시에 [GEM.GetNameDef]에 선전포고하기 전까지 §Y30일§! 동안 준비할 수 있을 것입니다. \n$GEH_fear_eyes_mission_tt$\n"
 GEH_fear_eyes_mission_tt: "§Y$GEH_operation_countenance$§! 임무가 활성화되면 [GetOperationCountenanceTooltip] 부대가 [GEM.GetNameDef]측을 항복시키기까지 §Y60 일§!을 갖게 됩니다. 만약 이 기한이 지날 경우 그들은 다른 세력에 가담하려고 시도할 것이고, 우리 국민들은 우리의 군사력에 대해 걱정하기 시작할 것입니다."
 GEH_shocked_by_surprise_attack: "기습 공격에 놀람"
 GEH_shocked_by_surprise_attack_desc: "우리에 대항한 선도부의 전략, 풍기집행은 우리 만마전 전체를 충격에 빠지게 하였습니다. 우리 군은 압도되었고, 우리 연락망은 단절되었으며, 상대 측 책임자들을 불러 해명을 요구하는 것도 의미 없다는 것을 알았습니다. 우리 측이 이 사태를 파악하려는 동안, 우리의 외교 관계는 무력화 될 것입니다."
 GEH_preparations_for_operation_countenance: "풍기집행 준비"
 GEH_operation_countenance: "풍기집행"
 GEH_external_activities: "선도부의 대외 활동"
 GEH_external_activities_desc: "게헨나 선도부는 대전이 이전 게헨나 학원이라는 거대 학원의 사법 집행 기관이었습니다. 그러나 대전이 이후 각지의 수많은 분쟁을 해결하며 만마전과의 의견 불일치로 점차 분리되었고, 이내 게헨나 선도부는 독립적인 군벌 집단을 형성하기에 이르렀습니다. 그러기에 게헨나 선도부의 외교 활동은 게헨나 학원을 평정하고 단일 학원을 수립하는 것에 있습니다."

 GEH_second_congress_focus: "제2차 선도부 총회"
 GEH_second_congress_focus_desc: "제1차 선도부 총회에서 결정된 정치적 방향을 이제 제2차 총회에서 본격적으로 논의하고 작성하여야 합니다."
 GEM_Start_nego_tt: "@GEM§Y[GEM.GetAdjective]§!(이)가 @GEA§Y[GEA.GetName]§!(과)와 협상 중임"

 GEH_stabilization_of_gehenna_nation: "게헨나 국가 안정화"
 GEH_cooperation_with_pandemonium: "만마전과 협력"
 GEH_instigating_confusion_in_pandemonium: "만마전 혼란 조장"

 GEH_additional_leadership_personnel_employment: "추가적인 선도부원 모집"
 GEH_additional_leadership_personnel_employment_desc: "행정 인력 부족이 확인된 지난 총회 이후, 게헨나 선도부의 행정 부담은 지속되어 왔습니다. 우리는 이제 이 문제를 해결하기 위한 다양한 모집 방안을 추구해야 합니다."
 GEH_establishment_of_german_autonomous_government: "독일 자치정부 수립"
 GEH_establishment_of_german_autonomous_government_desc: "독일 민족의 자치 정부 위원회, 약칭 독일 자치정부는 우리가 독일인들을 행정부로 등용하기 시작하면서 추진되기 시작한 독일 주 정부를 우리 아래에 통합하기 위한 기관입니다."
 GEH_establishment_of_german_militia: "독일인 민병대"
 GEH_establishment_of_german_militia_desc: "강제로 해산된 국방군, 또는 탈영병, 그 외 수많은 좌우를 가리지 않는 전 민병대원들까지. 이들을 동원한다면 간편하게 선도부의 인력을 확충할 수 있을 것입니다."

 GEH_iori_route_focus: "시로미 이오리의 중점"
 GEH_preparation_of_war_with_pantemonium: "[GEM.GetAdjective] 측과의 전쟁 준비"
 GEH_indiscriminate_conscription: "무차별 징병제 도입"
 GEH_propaganda_spread: "프로파간다 살포"
 GEH_expulsion_of_pandemonium: "판데모니엄 축출"
 GEH_systemic_militarization: "체제적 군사화"
 GEH_injecting_hostility: "적대감 주입"
 GEH_leadership_of_the_executive_branch: "실행부의 지도"
 GEH_war_department: "전쟁부"
 GEH_military_leadership_committee: "군사선도위원회"

 GEH_iori_route_focus_desc: "시로미 이오리는 이전 총회에서 자신의 능력을 입증하였고, 이내 만마전을 향한 공격이라는 거대한 테제 아래에 움직이는 선도부의 방향을 결정했습니다."
 GEH_preparation_of_war_with_pantemonium_desc: "[GEM.GetAdjective] 측은 우리 선도부를 향한 적대 행위를 대전이 이전부터 이어오고 있으며, 대전이 이후로는 공식적으로 우리를 향한 적대를 서슴지 않고 있습니다. 이들을 완전히 파멸시키지 않고서는 선도부에 미래란 존재하지 않습니다!"
 GEH_indiscriminate_conscription_desc: "만마전을 향한 거대한 투쟁을 위해서는 수많은 병력의 동원이 필요합니다. 학생과 독일인들을 가리지 않고 향후 벌어질 진격에 동원하기 위해 광범위한 동원 절차가 마련될 것입니다."
 GEH_propaganda_spread_desc: "[GEM.GetAdjective]의 지배 하에 있는 지역에 선도부를 향한 선전물을 배부하는 것은 만마전의 추악한 이상을 공개하고 선도부를 향한 지지를 끌어올릴 수 있을 것입니다."
 GEH_expulsion_of_pandemonium_desc: "이제 때가 되었습니다! 신속하고 빠르게 선도부의 군은 [GEM.GetAdjective]의 지배 영토로 향할 것입니다. 원한의 고리를 끊어내고 선도부의 항구적 평화를 만들어 내어야만 합니다."
 GEH_systemic_militarization_desc: "실행부는 선도부의 광범위한 무력행사를 담당하는 기관이며, 실행부의 지배적 권한을 정립하기 위해서는 다양한 군사적 체제가 도입되어야만 합니다."
 GEH_injecting_hostility_desc: "만마전을 향한 적대적 선전 교육을 의무화하여 우리의 낮은 지지율로 인한 학생들의 전쟁 동원 거부를 해결할 것입니다."
 GEH_leadership_of_the_executive_branch_desc: "언제까지 소라사키 히나의 책임을 가중하며 모든 군사작전을 직접 감독하에 진행할 수는 없습니다. 소라사키 히나의 개인에 가중되는 책임을 실행부에 양도할 것입니다. 이제는 선도부장이 아닌 선도부가 강조되어야 합니다."
 GEH_war_department_desc: "선도부는 이제 광범위한 전쟁을 준비해야 하며, 이러한 행동을 돕기 위해 실행부와 비슷한 역할을 하지만 조금 더 실험적이고 대비적인 핵심 인물들을 모은 전쟁부를 신설할 것입니다."
 GEH_military_leadership_committee_desc: "선도부의 통치는 선도부원이 선행되어야 합니다. 군사적 영광과 교리의 정립이 선도부의 존재 이유이자 선도부 이데올로기의 근간입니다."

 GEH_hina_route_focus: "소라사키 히나의 영도"
 GEH_one_person_leadership_system: "일인 지도 체제"
 GEH_firm_leadership: "확고한 지도력"
 GEH_gehenna_leader: "게헨나의 지도자"
 GEH_gehenna_leader_tt: "§R이제 소라사키 히나는 어떤 일이 있더라도 무너지지 않을 것입니다. 그녀의 결심이니까요.§!"
 GEH_distribution_of_propaganda_materials_in_gehenna: "게헨나 내 선전물 배부"
 GEH_distribution_of_propaganda_materials_in_gehenna_tt: "점령법 해금: §Y게헨나 통일 지배§!."
 GEH_national_unity: "국가적 단결"
 GEH_student_peoples_will: "학생 인민의 의지"
 GEH_distinction_of_zealous_members: "열성부원 구분"
 GEH_sorasaki_hina_quotes_compilation: "소라사키 히나 어록 편찬"
 GEH_prefect_team_fanaticism: "선도부의 광신"

 GEH_hina_route_focus_desc: "소라사키 히나의 가중된 책임이 불러온 편집증적인 현상 유지 정책이 결국 선도부원 전체의 열성적인 지지로 끝을 맺었습니다. 소라사키 히나 본인도, 선도부 임원 그 누구도 바라지 않던 일이나. 이제는 시작해야 합니다."
 GEH_one_person_leadership_system_desc: "선도부는 언제나 소라사키 히나의 최종 검수 하에 운영됩니다. 이는 강력한 정치적 카리스마를 제공하며, 소라사키 히나의 정책에 대한 반발을 크게 줄일 것입니다."
 GEH_firm_leadership_desc: "\"소라사키 히나 선도부장님의 영도를 따르지 않는 독일 나치스트들의 산업을 모조리 몰수하여야 한다! 모든 산업을 선도부에게!\" - 소라사키 히나 선전물 (중)"
 GEH_gehenna_leader_desc: "소라사키 히나는 광신적인 선도부원들의 열성을 위해서라도, 물러설 수 없습니다. 이제 소라사키 히나는 모든 수단을 동원하여 무거운 자리에 올라설 것입니다. 소라사키 각하시여. 이제 선도부의 첫 번째 전제 사항이 되신 것을 환영합니다."
 GEH_distribution_of_propaganda_materials_in_gehenna_desc: "소라사키 히나 선도부장님의 위대함을 게헨나 전체에 알린다면 소라사키 히나 선도부장님 또한 좋아하실 것이 분명합니다. 이 훌륭한 계몽 작업이 즉시 진행되어야 합니다."
 GEH_national_unity_desc: "게헨나 전체는 소라사키 히나 선도부장님의 영도 아래에 통합되어야만 합니다. 이는 모든 선도부원의 의지이자 게헨나의 미래입니다."
 GEH_student_peoples_will_desc: "광신적인 열성을 모두 학생과 선도부원 그리고 충성스러운 독일인들에게 돌린다면 잠깐은 이 열성에서 벗어날 수 있을지 모릅니다. 어쩌면 앞으로도 말이죠."
 GEH_distinction_of_zealous_members_desc: "선도부장님을 향해 충성하는 선도부원들이 구분되어야 합니다. 이는 충성적이지 않은 선도부원들을 한직으로 쫓아내는 것으로 시작될 것입니다."
 GEH_sorasaki_hina_quotes_compilation_desc: "\"게헨나의 모두가 알 수 있도록 소라사키 히나 선도부장 님의 위대한 어록을 편찬한 책\" - 소라사키 히나 어록 설명"
 GEH_prefect_team_fanaticism_desc: "선도부장님이야말로 이 선도부를 구원할 아주 강인한 초인이 분명합니다. 우리는 선도부장님을 더 강력하게 받들고 충성해야 합니다. 그 어떤 존재도 선도부장님의 권위에 도전하지 못하도록 말이죠!"

