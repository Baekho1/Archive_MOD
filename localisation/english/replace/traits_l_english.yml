 RED_bright_polar_star: "The North Star of Revolution Shines Red"
 RED_bright_polar_star_desc: "\n §L\"What is the source of civilizational progress and the development of history, or "social transformation"? - It is when the contradictions of society accumulate.\"\n\n Renka and Cherino finally had an epiphany. Cherino has truly become a revolutionary, standing at the center of the academy, at the center of the students, and shining resolutely as the "core of unity". The students and the people are united in solidarity around Cherino!\n\n However, this is not to say that Cherino is oppressing and tyrannizing as before. The people can always overthrow and oust her, but the leadership that Cherino has shown does not allow it. Refreshed by her own struggle and ideological learning, Cherino made a remarkable achievement in breaking through the internal contradictions of the Red Winter, such as the authoritarian organizational structure, conflicts with the locals, the gap between ideology and reality, and the industrial and economic restructuring, and transforming the old society into a new society.\n\n Cherino became a guide. Wandering among the contradictions, the people finally found the "North Star of the Revolution" and grasped it firmly in their hands. Once you've got your bearings, it's time to move forward!§!"
